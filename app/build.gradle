plugins {
    id 'com.android.application'
}

android {
    namespace 'com.friendspoker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.friendspoker.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('friendspoker.jks')
            storePassword 'friendspoker'
            keyAlias 'friendspoker'
            keyPassword 'friendspoker'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
