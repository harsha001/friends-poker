<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Friends Poker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Outfit:wght@400;500;600;700;800&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: portrait casino client. Lobby = profile header, hero, stake tiles, live tables. Table = icon top bar, tall stadium table with seats on its rail (you at the bottom), and an action dock pinned below. Sheets slide up for chat, history, leaderboard, menu and profile. Single dark look, by design. */
:root {
  --bg0: #08050f;
  --bg1: #160d29;
  --bg2: #22143d;
  --glass: rgba(255,255,255,.06);
  --glass-2: rgba(255,255,255,.1);
  --stroke: rgba(255,255,255,.1);
  --felt: #0d7553;
  --felt-hi: #19a777;
  --felt-lo: #063b2b;
  --leather: #1c1220;
  --gold: #f4c55a;
  --gold-hi: #ffe39a;
  --gold-lo: #a8741e;
  --ivory: #fffdf6;
  --ink: #15161a;
  --red: #d63a33;
  --text: #f3eefc;
  --muted: #a99cc4;
  --fold: #d9443a;
  --call: #24a862;
  --raise: #f39c2f;
  --blue: #3b8ee8;
  --ok: #4ade80;
  --warn: #fbbf24;
  --danger: #f87171;
  --display: "Righteous", "Trebuchet MS", system-ui, sans-serif;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "Rubik", "Outfit", system-ui, sans-serif;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--body); font-size: 15px;
  background:
    radial-gradient(70% 40% at 15% 0%, rgba(140, 70, 255, .28), transparent 70%),
    radial-gradient(60% 35% at 100% 15%, rgba(255, 70, 160, .16), transparent 70%),
    radial-gradient(80% 50% at 50% 110%, rgba(30, 200, 140, .14), transparent 70%),
    linear-gradient(180deg, var(--bg1), var(--bg0) 70%);
  background-attachment: fixed;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px 14px;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 700; background: var(--glass-2); color: var(--text); transition: transform .08s ease, filter .15s ease; }
button:active:not(:disabled) { transform: scale(.96); filter: brightness(1.15); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .35; cursor: default; }
input { background: rgba(0,0,0,.35); border: 1px solid var(--stroke); border-radius: 14px; padding: 13px 14px; width: 100%; min-width: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
.gold-btn { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo)); color: #2a1a02; box-shadow: 0 4px 0 #6d4a0f, 0 10px 22px rgba(244,197,90,.25); font-weight: 800; letter-spacing: .02em; }
.ghost { background: var(--glass); border: 1px solid var(--stroke); }
.note { color: var(--muted); font-size: 13px; }
.sec { font-family: var(--display); font-size: 17px; letter-spacing: .04em; color: var(--text); margin: 6px 2px -2px; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--stroke), transparent); }

/* ---------- Chips & cards ---------- */
.chip { width: 18px; height: 18px; border-radius: 50%; flex: none; position: relative; display: inline-block;
  background: repeating-conic-gradient(from 8deg, #fff 0 18deg, var(--c, #d63a33) 18deg 60deg);
  box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 2px 3px rgba(0,0,0,.5); }
.chip::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c, #d63a33) 70%, #fff), var(--c, #d63a33) 70%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.85); }
.chip.lg { width: 24px; height: 24px; }
.chip.xl { width: 44px; height: 44px; }
.stack { position: relative; display: inline-block; width: 24px; height: 28px; }
.stack .chip { position: absolute; left: 0; width: 24px; height: 24px; }
.card { width: 40px; height: 56px; border-radius: 6px; position: relative; flex: none; color: var(--ink);
  background: linear-gradient(165deg, #ffffff, var(--ivory) 55%, #ebe5d4);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 4px 8px rgba(0,0,0,.5); overflow: hidden; font-family: var(--num); }
.card .r { position: absolute; top: 2px; left: 4px; font-size: 17px; font-weight: 700; line-height: 1; letter-spacing: -.05em; }
.card .s1 { position: absolute; top: 20px; left: 5px; font-size: 11px; line-height: 1; font-family: system-ui, sans-serif; }
.card .pip { position: absolute; right: 2px; bottom: 0; font-size: 27px; line-height: 1; font-family: system-ui, sans-serif; }
.card.red { color: var(--red); }
.card.slot { background: rgba(0,0,0,.2); border: 1.5px dashed rgba(255,255,255,.16); box-shadow: none; }
.card.back { background:
    radial-gradient(circle at 50% 50%, rgba(244,197,90,.35) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, rgba(244,197,90,.18) 0 1.5px, transparent 1.5px 6px),
    repeating-linear-gradient(-45deg, rgba(244,197,90,.18) 0 1.5px, transparent 1.5px 6px),
    linear-gradient(160deg, #3b1f73, #1a0d3a);
  box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3.5px #3b1f73, 0 4px 8px rgba(0,0,0,.5); }
.card.xs { width: 22px; height: 31px; border-radius: 4px; }
.card.sm { width: 30px; height: 42px; border-radius: 5px; }
.card.sm .r { font-size: 13px; top: 2px; left: 3px; } .card.sm .s1 { display: none; } .card.sm .pip { font-size: 17px; }
.card.lg { width: 66px; height: 92px; border-radius: 9px; }
.card.lg .r { font-size: 30px; top: 4px; left: 6px; } .card.lg .s1 { font-size: 18px; top: 35px; left: 8px; } .card.lg .pip { font-size: 46px; right: 4px; }
.card.hl { box-shadow: 0 0 0 2.5px var(--gold), 0 0 16px rgba(244,197,90,.7), 0 4px 8px rgba(0,0,0,.5); }
.card.dim { filter: brightness(.55) saturate(.6); }

/* ---------- Lobby ---------- */
.profile { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
.av { border-radius: 50%; display: grid; place-items: center; flex: none; position: relative;
  background: radial-gradient(circle at 35% 30%, var(--a1, #6d4bd8), var(--a2, #2b1a5c) 75%);
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px rgba(0,0,0,.6), 0 6px 14px rgba(0,0,0,.5); }
.av .em { line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.profile .av { width: 52px; height: 52px; font-size: 28px; }
.profile .who { flex: 1; min-width: 0; }
.profile .nm { font-weight: 800; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--glass); border: 1px solid var(--stroke); font-size: 12px; color: var(--muted); font-weight: 600; }
.pill.goldp { color: var(--gold); border-color: rgba(244,197,90,.35); }
.iconbtn { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; border-radius: 13px; background: var(--glass); border: 1px solid var(--stroke); position: relative; }
.iconbtn svg { width: 21px; height: 21px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--fold); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg0); }
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 20px 18px 18px; min-height: 150px;
  background: radial-gradient(90% 120% at 100% 0%, rgba(255,120,200,.35), transparent 60%), linear-gradient(135deg, #4b23a8, #26105e 60%, #170a3d);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 16px 36px rgba(60,20,140,.45); }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: .95; margin: 0 0 8px; max-width: 60%; text-shadow: 0 3px 10px rgba(0,0,0,.4); }
.hero h1 span { color: var(--gold); }
.hero p { margin: 0; color: #d9ccf5; font-size: 13px; max-width: 58%; }
.hero .art { position: absolute; right: -6px; bottom: -10px; width: 46%; height: 140px; }
.hero .art .card { position: absolute; bottom: 18px; transform-origin: 50% 130%; }
.hero .art .card:nth-child(1) { right: 70px; transform: rotate(-24deg); }
.hero .art .card:nth-child(2) { right: 40px; transform: rotate(-6deg); bottom: 26px; }
.hero .art .card:nth-child(3) { right: 12px; transform: rotate(14deg); }
.hero .art .chip { position: absolute; }
.stakes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stake { position: relative; overflow: hidden; text-align: left; padding: 14px 14px 12px; border-radius: 18px; min-height: 112px; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(150deg, var(--s1), var(--s2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px rgba(0,0,0,.35); }
.stake .nm { font-family: var(--display); font-size: 21px; letter-spacing: .03em; }
.stake .bl { font-family: var(--num); font-weight: 600; font-size: 13px; opacity: .92; }
.stake .bi { font-size: 11px; opacity: .85; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.stake .chip.xl { position: absolute; right: -8px; top: -8px; opacity: .9; transform: rotate(12deg); }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; text-transform: uppercase; letter-spacing: .3em; font-family: var(--num); font-weight: 700; text-align: center; font-size: 18px; }
.joinrow button { padding-inline: 22px; }
.tables { display: flex; flex-direction: column; gap: 8px; }
.trow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: var(--glass); border: 1px solid var(--stroke); }
.trow .tic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(150deg, #0f8a61, #064b35); box-shadow: inset 0 0 0 2px rgba(244,197,90,.5); font-size: 20px; }
.trow .mid { flex: 1; min-width: 0; }
.trow .tc { font-family: var(--num); font-weight: 700; letter-spacing: .2em; color: var(--gold); }
.trow .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.dots { display: flex; gap: 3px; margin-top: 5px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.15); }
.dots i.on { background: var(--ok); box-shadow: 0 0 6px rgba(74,222,128,.7); }
.trow button { padding: 10px 16px; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0 8px; }

/* ---------- Table top bar ---------- */
.tbar { display: flex; align-items: center; gap: 8px; }
.tbar .codechip { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border-radius: 13px; background: var(--glass); border: 1px solid var(--stroke); font-size: 13px; color: var(--muted); font-weight: 600; padding: 0 10px; }
.tbar .codechip b { font-family: var(--num); color: var(--gold); letter-spacing: .2em; font-size: 15px; }

/* ---------- Table ---------- */
.tablewrap { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 61vh; margin: 24px auto 0; }
.rail { position: absolute; inset: 6% 9.5%; border-radius: 999px;
  background: radial-gradient(120% 60% at 50% 0%, #3a2440, var(--leather) 60%), var(--leather);
  box-shadow: 0 0 0 2px var(--gold-lo), 0 0 0 3px rgba(0,0,0,.6), 0 0 34px rgba(244,197,90,.18), 0 24px 50px rgba(0,0,0,.65), inset 0 2px 1px rgba(255,255,255,.12); }
.felt { position: absolute; inset: 9.5% 14%; border-radius: 999px; overflow: hidden;
  background: radial-gradient(70% 50% at 50% 42%, var(--felt-hi), var(--felt) 55%, var(--felt-lo));
  box-shadow: inset 0 0 0 2px rgba(244,197,90,.55), inset 0 0 0 9px rgba(0,0,0,.18), inset 0 0 50px rgba(0,0,0,.55); }
.felt::before { content: ""; position: absolute; inset: 7% 10%; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.08); }
.felt::after { content: ""; position: absolute; inset: 0; opacity: .25; background: repeating-radial-gradient(circle at 50% 40%, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
.logo-mark { position: absolute; left: 50%; top: 24%; transform: translateX(-50%); text-align: center; font-family: var(--display); color: rgba(255,255,255,.1); line-height: 1; white-space: nowrap; }
.logo-mark .s { font-size: 14px; letter-spacing: .4em; }
.logo-mark .t { font-size: 20px; letter-spacing: .08em; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%); display: flex; flex-direction: column; align-items: center; gap: 7px; width: 58%; z-index: 2; }
.street { font-size: 10px; text-transform: uppercase; letter-spacing: .24em; color: rgba(255,255,255,.6); font-weight: 700; }
.potpill { display: inline-flex; align-items: center; gap: 7px; background: rgba(0,0,0,.45); border: 1px solid rgba(244,197,90,.45); padding: 3px 13px 3px 4px; border-radius: 999px; font-family: var(--num); font-size: 15px; font-weight: 700; color: var(--gold-hi); box-shadow: 0 4px 12px rgba(0,0,0,.35); }
.board { display: flex; gap: 3px; justify-content: center; perspective: 600px; }
.board .card { width: 36px; height: 51px; }
.board .card .pip { font-size: 23px; } .board .card .s1 { top: 19px; }
.msg { min-height: 18px; text-align: center; font-size: 12.5px; color: #e9fff4; text-wrap: balance; max-width: 100%; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.msg .win { color: var(--gold-hi); font-weight: 800; }

/* Seats */
.seat { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 92px; z-index: 3; }
.seat .cards { display: flex; height: 26px; margin-bottom: -8px; position: relative; z-index: 3; }
.seat .cards .card + .card { margin-left: -8px; }
.seat .cards .card:first-child { transform: rotate(-9deg); } .seat .cards .card:last-child { transform: rotate(9deg); }
.seat .cards.show { height: 36px; margin-bottom: -12px; }
.seat .avw { position: relative; width: 54px; height: 54px; z-index: 2; }
.seat .av { position: absolute; inset: 5px; font-size: 24px; }
.ring { position: absolute; inset: 0; transform: rotate(-90deg); z-index: 3; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: rgba(0,0,0,.45); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; filter: drop-shadow(0 0 3px currentColor); }
.plate { margin-top: -7px; width: 92px; background: linear-gradient(180deg, rgba(30,20,50,.95), rgba(12,8,22,.95)); border: 1px solid rgba(255,255,255,.12); border-radius: 11px; padding: 8px 6px 4px; text-align: center; box-shadow: 0 6px 14px rgba(0,0,0,.5); }
.plate .nm { font-size: 11px; font-weight: 700; color: #e8e0f7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate .ch { font-family: var(--num); font-size: 12px; color: var(--gold-hi); font-weight: 700; }
.tag { display: inline-block; margin-top: 2px; font-size: 9px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; color: #fff; background: rgba(255,255,255,.12); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag.fold { background: #5b5566; } .tag.check { background: var(--blue); } .tag.call { background: var(--call); } .tag.raise { background: var(--raise); } .tag.allin { background: linear-gradient(90deg, #e2365b, #f39c2f); } .tag.out { background: #3d3550; color: var(--muted); } .tag.win { background: var(--gold); color: #2a1a02; } .tag.time { background: transparent; color: var(--gold-hi); font-family: var(--num); font-size: 11px; padding: 0; }
.seat.turn .plate { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(244,197,90,.45); }
.seat.folded .av, .seat.folded .plate { opacity: .5; filter: grayscale(.7); }
.seat.away { opacity: .55; }
.seat.winner .av { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 0 5px rgba(0,0,0,.5), 0 0 28px rgba(244,197,90,.95); } }
.dealer { position: absolute; width: 21px; height: 21px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8e0, var(--gold) 55%, var(--gold-lo)); color: #3a2502; font-size: 11px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.6), inset 0 0 0 1.5px rgba(255,255,255,.6); z-index: 4; transform: translate(-50%, -50%); font-family: var(--num); }
.betchip { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 3px; font-family: var(--num); font-size: 11.5px; font-weight: 700; color: #fff; background: rgba(0,0,0,.5); padding: 2px 7px 2px 2px; border-radius: 999px; z-index: 4; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.bubble { position: absolute; transform: translate(-50%, -100%); z-index: 8; background: #fff; color: #1a1030; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 12px; max-width: 120px; text-align: center; box-shadow: 0 6px 14px rgba(0,0,0,.45); pointer-events: none; animation: pop .25s ease-out both; }
.bubble.big { font-size: 26px; padding: 2px 6px; background: transparent; box-shadow: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%) rotate(45deg); width: 10px; height: 10px; background: inherit; }
.bubble.big::after { display: none; }
@keyframes pop { from { transform: translate(-50%, -80%) scale(.6); opacity: 0; } }
.float { position: absolute; transform: translate(-50%, -50%); font-family: var(--num); font-weight: 800; color: var(--gold-hi); font-size: 16px; z-index: 9; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.9); animation: floatup 2.6s ease-out .5s both; }
@keyframes floatup { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -46px; } }

/* motion */
.ghost-chip, .ghost-card { position: absolute; transform: translate(-50%, -50%); z-index: 7; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .betchip.fly { animation: fly .4s cubic-bezier(.3,.7,.4,1) both; }
  .ghost-chip { animation: fly .5s cubic-bezier(.4,0,.6,1) both, fade .2s ease-in .5s forwards; }
  .ghost-chip.award { animation: fly .7s cubic-bezier(.3,.7,.4,1) .35s both, fade .25s ease-in 1.05s forwards; }
  .ghost-card { animation: fly .38s cubic-bezier(.2,.8,.3,1) both, fade .15s linear .38s forwards; }
  .seat .cards.late .card { animation: appear .2s ease-out .45s both; }
  .board .card.flip { animation: flip .5s cubic-bezier(.2,.8,.3,1.1) both; }
  .card.deal { animation: dealin .35s cubic-bezier(.2,.8,.3,1.2) both; }
  .seat.turn .avw { animation: bob 1.4s ease-in-out infinite; }
  @keyframes fly { from { left: var(--sx); top: var(--sy); } }
  @keyframes fade { to { opacity: 0; } }
  @keyframes appear { from { opacity: 0; } }
  @keyframes flip { from { transform: rotateY(90deg) translateY(-6px); filter: brightness(.6); } }
  @keyframes dealin { from { transform: translateY(-30px) rotate(-12deg) scale(.7); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-3px); } }
}
@media (prefers-reduced-motion: reduce) { .ghost-chip, .ghost-card { display: none; } }

/* ---------- Dock ---------- */
.dock { background: linear-gradient(180deg, rgba(40,26,70,.92), rgba(16,10,30,.96)); border: 1px solid var(--stroke); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 -8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
.dock .head { display: flex; gap: 12px; align-items: center; }
.dock .hole { display: flex; gap: 5px; flex: none; }
.dock .hole .card:first-child { transform: rotate(-5deg); } .dock .hole .card:last-child { transform: rotate(5deg); }
.dock .info { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
.dock .strength { font-family: var(--display); font-size: 20px; line-height: 1.05; }
.meter { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ef4444, #f59e0b 45%, #22c55e); background-size: var(--bgw, 100%) 100%; transition: width .4s ease; }
.dock .stk { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; font-family: var(--num); font-weight: 600; }
.dock .stk b { color: var(--gold-hi); }
.clock { display: flex; flex-direction: column; gap: 5px; }
.clock .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; }
.clock .lbl b { font-family: var(--num); color: #fff; }
.clock .track { height: 6px; background: rgba(0,0,0,.45); border-radius: 99px; overflow: hidden; }

<body>
<div class="offline" id="offline" hidden>Offline · reconnecting…</div>
<div class="wrap" id="app">
  <div class="hero"><h1>Friends <span>Poker</span></h1><p>Shuffling up… connecting to the card room.</p></div>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>

<script>

(() => {
"use strict";
const RANKS = "23456789TJQKA";
const SUITS = { s: "♠", h: "♥", d: "♦", c: "♣" };
const HAND_NAMES = ["High card","Pair","Two pair","Three of a kind","Straight","Flush","Full house","Four of a kind","Straight flush"];
const MAX_PLAYERS = 9;
const TURN_MS = 60000;       // shot clock per move
const NEXT_HAND_MS = 7000;   // pause between hands before the host's app deals again
let skew = 0;                // phone clock vs Firebase server clock
const now = () => Date.now() + skew;

let rdb = null, myId = null, online = true;
let tableCode = null, S = null, unsubTable = null, unsubList = null, openTables = [];
let raiseOpen = false, raiseVal = 0, busy = false;

const $app = document.getElementById("app");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");

function toast(text, ok) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "toast" + (ok ? " ok" : ""); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- Hand evaluation ---------- */
const rv = c => RANKS.indexOf(c[0]) + 2;
function eval5(cs) {
  const v = cs.map(rv).sort((a, b) => b - a);
  const flush = cs.every(c => c[1] === cs[0][1]);
  const uniq = [...new Set(v)];
  let straightHigh = 0;
  if (uniq.length === 5) {
    if (v[0] - v[4] === 4) straightHigh = v[0];
    else if (v.join() === "14,5,4,3,2") straightHigh = 5;
  }
  const cnt = {}; v.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  const groups = Object.entries(cnt).map(([k, n]) => [n, +k]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const kick = groups.map(g => g[1]);
  if (straightHigh && flush) return [8, straightHigh];
  if (groups[0][0] === 4) return [7, ...kick];
  if (groups[0][0] === 3 && groups[1][0] === 2) return [6, ...kick];
  if (flush) return [5, ...v];
  if (straightHigh) return [4, straightHigh];
  if (groups[0][0] === 3) return [3, ...kick];
  if (groups[0][0] === 2 && groups[1][0] === 2) return [2, ...kick];
  if (groups[0][0] === 2) return [1, ...kick];
  return [0, ...v];
}
function cmp(a, b) { for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; }
function best(cards) {
  if (cards.length < 5) return null;
  let top = null, topCards = null;
  const n = cards.length;
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let c = b + 1; c < n; c++) for (let d = c + 1; d < n; d++) for (let e = d + 1; e < n; e++) {
    const five = [cards[a], cards[b], cards[c], cards[d], cards[e]];
    const s = eval5(five);
    if (!top || cmp(s, top) > 0) { top = s; topCards = five; }
  }
  return { score: top, cards: topCards, name: HAND_NAMES[top[0]] };
}
function partialName(cards) {
  const v = cards.map(rv);
  if (cards.length === 2) return v[0] === v[1] ? "Pocket pair" : (cards[0][1] === cards[1][1] ? "Suited" : "Offsuit");
  return "";
}

/* ---------- Game engine (pure state mutations) ---------- */
function newDeck() {
  const d = [];
  for (const r of RANKS) for (const s of "shdc") d.push(r + s);
  const rnd = new Uint32Array(d.length); crypto.getRandomValues(rnd);
  for (let i = d.length - 1; i > 0; i--) { const j = rnd[i] % (i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
const canAct = p => p.inHand && !p.folded && !p.allIn;
const live = p => p.inHand && !p.folded;
function nextIdx(S, from, pred) {
  const n = S.players.length;
  for (let k = 1; k <= n; k++) { const i = ((from + k) % n + n) % n; if (pred(S.players[i])) return i; }
  return -1;
}
const dealerIdx = S => S.players.findIndex(p => p.id === S.dealerId);
function put(p, a) { a = Math.max(0, Math.min(a, p.chips)); p.chips -= a; p.bet += a; p.total += a; if (p.chips === 0) p.allIn = true; return a; }
function log(S, text) { S.log = [text, ...(S.log || [])].slice(0, 30); }
const potOf = S => S.players.reduce((t, p) => t + (p.total || 0), 0);

function startHand(S) {
  S.players = S.players.filter(p => !p.leaving);
  const ready = S.players.filter(p => p.chips > 0 && !p.sittingOut);
  if (ready.length < 2) return "Need at least 2 players with chips to deal.";
  for (const p of S.players) Object.assign(p, { hole: [], inHand: p.chips > 0 && !p.sittingOut, folded: false, allIn: false, bet: 0, total: 0, acted: false, last: "" });
  const prev = dealerIdx(S);
  const d = nextIdx(S, prev === -1 ? -1 : prev, p => p.inHand);
  S.dealerId = S.players[d].id;
  const headsUp = ready.length === 2;
  const sb = headsUp ? d : nextIdx(S, d, p => p.inHand);
  const bb = nextIdx(S, sb, p => p.inHand);
  put(S.players[sb], S.sb); S.players[sb].last = "SB " + S.sb;
  put(S.players[bb], S.bb); S.players[bb].last = "BB " + S.bb;
  S.deck = newDeck();
  let i = d;
  for (let round = 0; round < 2; round++) for (let k = 0; k < ready.length; k++) { i = nextIdx(S, i, p => p.inHand); S.players[i].hole.push(S.deck.pop()); }
  S.board = []; S.street = "preflop"; S.status = "playing"; S.handNo = (S.handNo || 0) + 1;
  S.currentBet = Math.max(...S.players.map(p => p.bet)); S.minRaise = S.bb;
  S.results = null; S.message = "";
  log(S, `Hand #${S.handNo} dealt · ${S.players[d].name} has the button`);
  S.turn = nextIdx(S, bb, canAct);
  S.turnAt = now();
  if (S.turn === -1 || S.players.filter(canAct).length === 0) progress(S, bb);
  return null;
}

function act(S, pid, type, amount) {
  if (S.status !== "playing") return "No hand in progress.";
  const p = S.players[S.turn];
  if (!p || p.id !== pid) return "It's not your turn.";
  const toCall = S.currentBet - p.bet;
  const raiseTo = target => {
    const inc = target - S.currentBet;
    if (inc >= S.minRaise) S.minRaise = inc;
    S.currentBet = target;
    put(p, target - p.bet);
    for (const o of S.players) if (o !== p && canAct(o)) o.acted = false;
    p.last = p.allIn ? `All-in ${fmt(p.bet)}` : `Raise to ${fmt(target)}`;
  };
  if (type === "fold") { p.folded = true; p.last = "Fold"; }
  else if (type === "check") { if (toCall > 0) return `You need to call ${fmt(toCall)} or fold.`; p.last = "Check"; }
  else if (type === "call") {
    if (toCall <= 0) { p.last = "Check"; }
    else { put(p, toCall); p.last = p.allIn ? `All-in ${fmt(p.bet)}` : `Call ${fmt(toCall)}`; }
  }
  else if (type === "raise") {
    const max = p.bet + p.chips, min = S.currentBet + S.minRaise;
    amount = Math.floor(amount);
    if (!(amount > S.currentBet)) return "A raise must be more than the current bet.";
    if (amount > max) return `You only have ${fmt(max)} total.`;
    if (amount < min && amount < max) return `Minimum raise is to ${fmt(min)}.`;
    raiseTo(amount);
  }
  else if (type === "allin") {
    const target = p.bet + p.chips;
    if (target <= S.currentBet) { put(p, p.chips); p.last = `All-in ${fmt(p.bet)}`; }
    else raiseTo(target);
  }
  else return "Unknown action.";
  p.acted = true;
  log(S, `${p.name}: ${p.last}`);
  progress(S, S.turn);
  return null;
}

function progress(S, from) {
  const liveP = S.players.filter(live);
  if (liveP.length === 1) return winByFold(S, liveP[0]);
  const actors = S.players.filter(canAct);
  const done = actors.length === 0
    || actors.every(p => p.acted && p.bet === S.currentBet)
    || (actors.length === 1 && actors[0].bet >= S.currentBet && S.players.filter(live).every(p => p.allIn || p === actors[0]));
  if (!done) {
    S.turn = nextIdx(S, from, p => canAct(p) && (!p.acted || p.bet < S.currentBet));
    S.turnAt = now();
    return;
  }
  const deal = () => {
    for (const p of S.players) { p.bet = 0; p.acted = false; if (live(p) && !p.allIn) p.last = ""; }
    S.currentBet = 0; S.minRaise = S.bb;
    S.deck.pop(); // burn
    if (S.street === "preflop") { S.board.push(S.deck.pop(), S.deck.pop(), S.deck.pop()); S.street = "flop"; }
    else if (S.street === "flop") { S.board.push(S.deck.pop()); S.street = "turn"; }
    else if (S.street === "turn") { S.board.push(S.deck.pop()); S.street = "river"; }
  };
  if (S.street === "river") return showdown(S);
  deal();
  while (S.players.filter(canAct).length < 2 && S.street !== "river") deal();
  if (S.players.filter(canAct).length < 2) return showdown(S);
  S.turn = nextIdx(S, dealerIdx(S), canAct);
  S.turnAt = now();
}

function winByFold(S, w) {
  const pot = potOf(S);
  w.chips += pot;
  for (const p of S.players) p.bet = 0;
  S.results = { reveal: false, winners: [{ id: w.id, amount: pot, hand: "" }], hands: {} };
  S.message = `${w.name} wins ${fmt(pot)}`;
  log(S, `${w.name} wins ${fmt(pot)} (everyone else folded)`);
  record(S, pot, false);
  S.status = "over"; S.turn = -1; S.overAt = now();
}

function showdown(S) {
  for (const p of S.players) p.bet = 0;
  const hands = {};
  for (const p of S.players.filter(live)) hands[p.id] = best([...p.hole, ...S.board]);
  const contribs = S.players.filter(p => p.total > 0);
  const levels = [...new Set(contribs.map(p => p.total))].sort((a, b) => a - b);
  const won = {};
  let prev = 0;
  const order = []; // seat order starting left of dealer, for odd chips
  let i = dealerIdx(S);
  for (let k = 0; k < S.players.length; k++) { i = (i + 1) % S.players.length; order.push(S.players[i].id); }
  for (const lvl of levels) {
    const amount = contribs.reduce((t, p) => t + Math.max(0, Math.min(p.total, lvl) - prev), 0);
    let elig = S.players.filter(p => live(p) && p.total >= lvl);
    if (!elig.length) elig = S.players.filter(live);
    let top = null, ws = [];
    for (const p of elig) { const c = top ? cmp(hands[p.id].score, top) : 1; if (c > 0) { top = hands[p.id].score; ws = [p]; } else if (c === 0) ws.push(p); }
    ws.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    const share = Math.floor(amount / ws.length);
    let rem = amount - share * ws.length;
    for (const w of ws) { const a = share + (rem-- > 0 ? 1 : 0); won[w.id] = (won[w.id] || 0) + a; }
    prev = lvl;
  }
  const winners = Object.entries(won).map(([id, amount]) => {
    const p = S.players.find(x => x.id === id); p.chips += amount;
    return { id, amount, hand: hands[id].name };
  });
  const handInfo = {};
  for (const [id, h] of Object.entries(hands)) handInfo[id] = { name: h.name, cards: h.cards };
  S.results = { reveal: true, winners, hands: handInfo };
  record(S, winners.reduce((t, w) => t + w.amount, 0), true);
  S.message = winners.map(w => `${S.players.find(p => p.id === w.id).name} wins ${fmt(w.amount)} with ${w.hand.toLowerCase()}`).join(" · ");
  log(S, S.message);
  S.status = "over"; S.turn = -1; S.overAt = now();
}

function record(S, pot, reveal) {
  const nm = id => (S.players.find(p => p.id === id) || {}).name || "?";
  const h = { n: S.handNo, pot, board: S.board.slice(),

}

function renderTable() {
  if (!S) return `<div class="hero"><h1>Friends <span>Poker</span></h1><p>Taking your seat at ${esc(tableCode)}…</p></div>`;
  const meIdx = S.players.findIndex(p => p.id === myId);
  const me = S.players[meIdx];
  const isHost = S.hostId === myId;
  const pot = potOf(S);
  const dIdx = dealerIdx(S);
  const turnP = S.status === "playing" ? S.players[S.turn] : null;
  const winnerIds = new Set((S.results?.winners || []).map(w => w.id));
  const P = prevSnap && prevSnap.code === S.code ? prevSnap : null;
  const newHand = !P || P.handNo !== S.handNo;
  const handEnded = P && P.handNo === S.handNo && P.status === "playing" && S.status === "over";
  const streetEnd = P && P.handNo === S.handNo && (S.board.length > P.boardLen || handEnded);
  const lay = seatLayout(S.players.length, meIdx);
  layoutMap = {}; for (const s of lay) layoutMap[S.players[s.idx].id] = s;

  const board = [0, 1, 2, 3, 4].map(i => {
    const c = S.board[i];
    const used = S.status === "over" && S.results?.reveal && c && (S.results.winners || []).some(w => S.results.hands[w.id]?.cards.includes(c));
    const flip = c && P && !newHand && i >= P.boardLen;
    const d = flip ? `style="animation-delay:${(i - P.boardLen) * 0.12 + (streetEnd ? .35 : 0)}s"` : "";
    return cardHTML(c, (flip ? "flip " : "") + (used ? "hl" : ""), d);
  }).join("");

  let msg = "";
  if (S.status === "lobby") msg = S.players.length < 2 ? "Waiting for friends · tap the code to invite" : (isHost ? "Everyone in? Deal the first hand." : "Waiting for the host to deal");
  else if (S.status === "over") msg = `<span class="win">${esc(S.message)}</span>`;
  else if (turnP) msg = turnP.id === myId ? "Your move" : `${esc(turnP.name)} is thinking…`;

  const C = 2 * Math.PI * 24;
  let seats = "", extras = "", ghosts = "";
  lay.forEach(({ idx, x, y }, order) => {
    const p = S.players[idx];
    const isMe = p.id === myId;
    const showFace = S.status === "over" && S.results?.reveal && live(p) && !isMe;
    let cards = "", cardsCls = "";
    if (isMe && p.inHand && p.hole.length) { const bh0 = S.board.length >= 3 ? best([...p.hole, ...S.board]) : null; cards = p.hole.map(c => cardHTML(c, "sm" + (bh0 && bh0.cards.includes(c) ? " hl" : "") + (p.folded ? " dim" : ""))).join(""); cardsCls = "show" + (newHand && S.status === "playing" ? " late" : ""); }
    else if (showFace) { cards = p.hole.map(c => cardHTML(c, "sm" + (winnerIds.has(p.id) && S.results.hands[p.id]?.cards.includes(c) ? " hl" : ""))).join(""); cardsCls = "show"; }
    else if (!isMe && live(p) && S.status !== "lobby") {
      cards = cardHTML("back", "xs") + cardHTML("back", "xs");
      if (newHand && S.status === "playing") cardsCls = "late";
    }
    if (newHand && S.status === "playing" && p.inHand) {
      for (let k = 0; k < 2; k++) ghosts += `<div class="ghost-card" style="left:${x}%;top:${y - 6}%;--sx:50%;--sy:44%;animation-delay:${(k * lay.length + order) * 0.05}s,${(k * lay.length + order) * 0.05 + .38}s">${cardHTML("back", "xs")}</div>`;
    }
    const isTurn = turnP && turnP.id === p.id;
    const frac = isTurn ? timeLeft() / TURN_MS : 1;
    const ring = isTurn ? `<svg class="ring" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="24"/><circle class="fg" data-ring cx="27" cy="27" r="24" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg>` : "";
    let [tag, tcls] = tagFor(p, S);
    if (S.status === "over" && S.results?.reveal && live(p)) { tag = S.results.hands[p.id]?.name || tag; tcls = winnerIds.has(p.id) ? "win" : ""; }
    else if (S.status === "over" && winnerIds.has(p.id)) { tag = "Winner"; tcls = "win"; }
    if (isTurn) { tag = `${Math.ceil(timeLeft() / 1000)}s`; tcls = "time"; }
    seats += `<div class="seat ${isTurn ? "turn" : ""} ${p.inHand && p.folded ? "folded" : ""} ${winnerIds.has(p.id) && S.status === "over" ? "winner" : ""} ${p.sittingOut && !p.inHand ? "away" : ""}" style="left:${x}%;top:${y}%">
      <div class="cards ${cardsCls}">${cards}</div>
      <div class="avw">${ring}${avHTML(p.id, p.av)}</div>
      <div class="plate"><div class="nm">${esc(isMe ? "You" : p.name)}</div><div class="ch">${fmt(p.chips)}</div>${tag ? `<span class="tag ${tcls}" ${isTurn ? "data-secs" : ""}>${esc(tag)}</span>` : ""}</div>
    </div>`;
    const b = betPos(x, y);
    if (p.bet > 0) {
      const fly = !P || (P.bets[p.id]?.amt || 0) < p.bet;
      extras += `<div class="betchip ${fly ? "fly" : ""}" style="left:${b.x}%;top:${b.y}%;--sx:${x}%;--sy:${y}%">${chipHTML(p.bet)}${fmt(p.bet)}</div>`;
    }
    if (idx === dIdx && S.status !== "lobby") extras += `<div class="dealer" style="left:${x + (x <= 50 ? 14 : -14)}%;top:${y + 4}%">D</div>`;
    if (handEnded && winnerIds.has(p.id)) {
      const w = S.results.winners.find(w => w.id === p.id);
      ghosts += `<div class="ghost-chip award" style="left:${x}%;top:${y}%;--sx:${POT.x}%;--sy:${POT.y}%">${stackHTML(w.amount)}</div>`;
      ghosts += `<div class="float" style="left:${x}%;top:${y - 13}%">+${fmt(w.amount)}</div>`;
    }
  });
  if (streetEnd && P) for (const id in P.bets) {
    const b = P.bets[id]; if (!b.amt) continue;
    ghosts += `<div class="ghost-chip" style="left:${POT.x}%;top:${POT.y}%;--sx:${b.x}%;--sy:${b.y}%">${chipHTML(b.amt, "lg")}</div>`;
  }

  // Dock
  let dock = "";
  if (!me) {
    dock = `<div class="dock"><div class="note">You're watching this table.</div><button class="gold-btn" id="sitBtn">Take a seat</button></div>`;
  } else {
    const hole = me.hole && me.inHand ? me.hole : [];
    const bh = hole.length && S.board.length >= 3 ? best([...hole, ...S.board]) : null;
    const strength = me.folded && me.inHand ? "Folded" : bh ? bh.name : (hole.length === 2 ? partialName(hole) : (me.sittingOut ? "Sitting out" : S.status === "playing" ? "Waiting for next hand" : S.status === "over" ? "Hand over" : "Waiting for the deal"));
    const pct = hole.length === 2 && !me.folded ? strengthPct(hole, S.board) : 0;
    dock = `<div class="dock">
      <div class="head">
        <div class="info">
          <div class="strength">${esc(strength)}</div>
          <div class="meter" title="Hand strength"><i style="width:${pct.toFixed(0)}%;--bgw:${pct ? (10000 / pct).toFixed(0) : 100}%"></i></div>
          <div class="stk">${chipHTML(me.chips, "lg")}<b>${fmt(me.chips)}</b>${me.bet ? ` · in pot ${fmt(me.bet)}` : ""}</div>
        </div>
      </div>
      ${me.sittingOut ? `<div class="banner"><span class="t">You're sitting out. You won't be dealt in.</span><button class="gold-btn" id="backBtn" style="padding:9px 14px">I'm back</button></div>` : ""}
      ${actionArea(me)}
      ${betweenHands(me, isHost)}
    </div>`;
  }

  return `
  <div class="tbar">
    <button class="iconbtn" id="lobbyBtn" aria-label="Lobby">${ICON.back}</button>
    <button class="codechip" id="copyBtn">${S.stake ? esc((STAKES.find(k => k.id === S.stake) || {}).name || "") + " · " : ""}${fmt(S.sb)}/${fmt(S.bb)} · <b>${esc(S.code)}</b></button>
    <button class="iconbtn" id="chatBtn" aria-label="Chat">${ICON.chat}<span class="badge" id="chatBadge" hidden></span></button>
    <button class="iconbtn" id="lbBtn" aria-label="Leaderboard">${ICON.trophy}</button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">${ICON.menu}</button>
  </div>
  <div class="tablewrap" id="tablewrap">
    <div class="rail"></div>
    <div class="felt"><div class="logo-mark"><div class="s">♠ ♥ ♣ ♦</div><div class="t">FRIENDS POKER</div></div></div>
    <div class="center">
      <div class="street">${esc(S.status === "playing" ? S.street : S.status === "over" ? (S.results?.reveal ? "showdown" : "hand over") : "waiting")}${S.handNo ? ` · hand ${S.handNo}` : ""}</div>
      <div class="potpill">${stackHTML(pot)}${fmt(pot)}</div>
      <div class="board">${board}</div>
      <div class="msg">${msg}</div>
    </div>
    ${extras}${seats}${ghosts}
    <div id="bubbles"></div>
  </div>
  ${dock}`;
}

function actionArea(me) {
  if (S.status !== "playing" || !me.inHand || me.folded || me.allIn) return "";
  const myTurn = S.players[S.turn]?.id === myId;
  const toCall = S.currentBet - me.bet;
  if (!myTurn) {
    const opts = [["checkfold", toCall > 0 ? "Check/Fold" : "Check/Fold"], ["check", "Check"], ["callany", "Call any"]];
    return `<div class="pre">${opts.map(([k, l]) => `<button data-pre="${k}" class="${preAct === k && preKey === preKeyNow() ? "on" : ""}"><i></i>${l}</button>`).join("")}</div>`;
  }
  const left = timeLeft();
  const clock = `<div class="clock ${left < 10000 ? "warn" : ""}" data-clock><div class="lbl"><span>Your turn</span><b data-clocksecs>${Math.ceil(left / 1000)}s</b></div><div class="track"><div class="fill" data-clockfill style="width:${(left / TURN_MS * 100).toFixed(1)}%"></div></div></div>`;
  const maxTo = me.bet + me.chips;
  const minTo = Math.min(S.currentBet + S.minRaise, maxTo);
  const canRaise = maxTo > S.currentBet && toCall < me.chips;
  if (raiseOpen && canRaise) {
    raiseVal = Math.max(minTo, Math.min(raiseVal || minTo, maxTo));
    const pot = potOf(S);
    const half = Math.min(maxTo, Math.max(minTo, S.currentBet + Math.floor((pot + toCall) / 2)));
    const full = Math.min(maxTo, Math.max(minTo, S.currentBet + pot + toCall));
    return `${clock}<div class="raise">
      <div class="amt"><span class="note">${S.currentBet ? "Raise to" : "Bet"}</span><b id="raiseAmt">${fmt(raiseVal)}</b></div>
      <input type="range" id="raiseRange" min="${minTo}" max="${maxTo}" step="${Math.max(1, Math.min(S.bb / 2, 50))}" value="${raiseVal}" aria-label="Raise amount">
      <div class="quick" style="display:grid;grid-template-columns:repeat(4,1fr)"><button data-amt="${minTo}">Min</button><button data-amt="${half}">½ Pot</button><button data-amt="${full}">Pot</button><button data-amt="${maxTo}">All-in</button></div>
      <div class="acts" style="grid-template-columns:1fr 2fr"><button class="ghost" id="raiseCancel" style="color:var(--text)">Back</button><button class="a-raise" id="raiseGo">${raiseVal >= maxTo ? "All-in" : S.currentBet ? "Raise" : "Bet"}<small>${fmt(raiseVal)}</small></button></div>
    </div>`;
  }
  const callTxt = toCall <= 0 ? "Check" : toCall >= me.chips ? "All-in" : "Call";
  return `${clock}<div class="acts">
    <button class="a-fold" data-act="fold">Fold</button>
    <button class="a-call" data-act="${toCall <= 0 ? "check" : "call"}">${callTxt}${toCall > 0 ? `<small>${fmt(Math.min(toCall, me.chips))}</small>` : ""}</button>
    <button class="a-raise" id="raiseOpen" ${canRaise ? "" : "disabled"}>${S.currentBet ? "Raise" : "Bet"}<small>${canRaise ? fmt(minTo) + "+" : ""}</small></button>
  </div>`;
}

function canDeal(st) { return st.hostId === myId || (st.status === "over" && now() > (st.overAt || 0) + 30000); }
function betweenHands(me, isHost) {
  if (S.status === "playing") return "";
  const b = [];
  if (S.status === "over" && isHost) b.push(`<div class="note" data-nexthand>Next hand soon…</div><button class="gold-btn" id="dealBtn">Deal now</button>`);
  else if (canDeal(S)) b.push(`<button class="gold-btn" id="dealBtn">${S.status === "lobby" ? "Deal first hand" : "Deal next hand"}</button>`);
  else if (S.status === "over") b.push(`<div class="note">Next hand starting soon…</div>`);
  if (me.chips === 0) b.push(`<button class="gold-btn" id="topBtn">Rebuy ${fmt(S.startChips)}</button>`);
  else if (me.chips < S.startChips && S.status !== "lobby") b.push(`<button class="ghost" id="topBtn">Top up to ${fmt(S.startChips)}</button>`);
  return b.length ? `<div class="bar2">${b.join("")}</div>` : "";
}

/* ---------- Bubbles over seats ---------- */
function renderBubbles() {
  const el = document.getElementById("bubbles"); if (!el || !S) return;
  const latest = {};
  for (const m of chatMsgs) if (now() - m.t < 4500) latest[m.id] = m;
  el.innerHTML = Object.values(latest).map(m => {
    const pos = layoutMap[m.id]; if (!pos) return "";
    return `<div class="bubble ${isEmoji(m.text) ? "big" : ""}" style="left:${pos.x}%;top:${pos.y - 9}%">${esc(m.text)}</div>`;
  }).join("");
}

/* ---------- Sheets ---------- */
let sheet = null;
function openSheet(name) { sheet = name; if (name === "chat") lastSeenChat = now(); renderSheet(); updateBadge(); }
function closeSheet() { sheet = null; renderSheet(); }
function renderSheet() {
  const host = document.getElementById("sheet");
  if (!sheet) { host.innerHTML = ""; return; }
  // keep the chat composer intact while messages arrive
  if (sheet === "chat" && host.querySelector("#chatList")) { host.querySelector("#chatList").innerHTML = chatListHTML(); scrollChat(); return; }
  const title = { chat: "Table chat", history: "Hand history", lb: "Leaderboard", menu: "Table menu", profile: "Your profile" }[sheet];
  host.innerHTML = `<div class="sheet-ov" id="sheetOv"><div class="sheet" role="dialog" aria-label="${title}"><div class="grab"></div>
    <div class="sh-head"><h3>${title}</h3><button class="x" id="sheetX" aria-label="Close">${ICON.x}</button></div>
    <div class="body">${sheetBody()}</div></div></div>`;
  host.querySelector("#sheetOv").addEventListener("click", e => { if (e.target.id === "sheetOv") closeSheet(); });
  host.querySelector("#sheetX").addEventListener("click", closeSheet);
  bindSheet(host);
  if (sheet === "chat") scrollChat();
}
function scrollChat() { const l = document.getElementById("chatList"); if (l) l.parentElement.scrollTop = 1e6; }
function chatListHTML() {
  if (!chatMsgs.length) return `<div class="empty">No messages yet. Say hi to the table.</div>`;
  return chatMsgs.map(m => `<div class="cm ${m.id === myId ? "mine" : ""}">${avHTML(m.id, m.av)}<div class="b ${isEmoji(m.text) ? "emo" : ""}">${m.id !== myId && !isEmoji(m.text) ? `<small>${esc(m.name)}</small>` : ""}${esc(m.text)}</div></div>`).join("");
}
function sheetBody() {
  if (sheet === "chat") {
    return `<div class="chatlist" id="chatList">${chatListHTML()}</div>
      <div class="quick emo">${["😂", "👍", "🔥", "😱", "😡", "🤑", "👏", "🙏", "😎", "🤡"].map(e => `<button data-say="${e}">${e}</button>`).join("")}</div>
      <div class="quick">${["Nice hand!", "Good luck", "Hurry up!", "Wow", "All in?", "GG"].map(t => `<button data-say="${t}">${t}</button>`).join("")}</div>
      <div class="chatin"><input id="chatIn" maxlength="120" placeholder="Message the table" aria-label="Chat message"><button class="gold-btn" id="chatSend">Send</button></div>`;
  }
  if (sheet === "history") {
    const h = S?.history || [];
    if (!h.length) return `<div class="empty">No hands played yet.</div>`;
    return h.map(x => `<div class="hh"><div class="top"><span>Hand ${x.n}</span><span>Pot <b>${fmt(x.pot)}</b></span></div>
      <div class="w">🏆 ${x.winners.map(w => `${esc(w.name)} +${fmt(w.amount)}${w.hand ? ` · ${esc(w.hand)}` : ""}`).join(", ")}</div>
      ${x.board.length ? `<div class="cards">${x.board.map(c => cardHTML(c, "sm")).join("")}</div>` : `<div class="note">Won before the flop</div>`}
      ${x.shown.length ? `<div class="sh">${x.shown.map(s => `<span>${esc(s.name)}: ${s.cards.map(c => `${c[0] === "T" ? "10" : c[0]}${SUITS[c[1]]}`).join(" ")}${s.hand ? ` (${esc(s.hand)})` : ""}</span>`).join("")}</div>` : ""}
    </div>`).join("");
  }
  if (sheet === "lb") {
    const rows = (S?.players || []).map(p => ({ p, net: p.chips - (p.buyIn || S.startChips) })).sort((a, b) => b.net - a.net);
    return rows.map((r, i) => `<div class="lb"><span class="rk">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</span>${avHTML(r.p.id, r.p.av)}
      <div class="nm">${esc(r.p.id === myId ? r.p.name + " (you)" : r.p.name)}<small>${fmt(r.p.chips)} chips · bought ${fmt(r.p.buyIn || S.startChips)}</small></div>
      <span class="net ${r.net > 0 ? "pos" : r.net < 0 ? "neg" : ""}">${r.net > 0 ? "+" : ""}${fmt(r.net)}</span></div>`).join("") +
      `<div class="note" style="padding:4px 2px">Net = chips now minus chips bought (buy-in, top-ups and rebuys).</div>`;
  }
  if (sheet === "menu") {
    const me = S?.players.find(p => p.id === myId);
    return `<button class="mrow" data-m="invite">${ICON.share}Invite friends<span class="sub num">${esc(S?.code || "")}</span></button>
      ${me ? `<button class="mrow" data-m="sit">${me.sittingOut ? ICON.play : ICON.pause}${me.sittingOut ? "I'm back" : "Sit out next hand"}</button>
      <button class="mrow" data-m="top">${ICON.plus}${me.chips === 0 ? "Rebuy" : "Top up"}<span class="sub num">to ${fmt(S.startChips)}</span></button>` : ""}
      <button class="mrow" data-m="history">${ICON.hist}Hand history</button>
      <button class="mrow" data-m="lb">${ICON.trophy}Leaderboard</button>
      ${me ? `<button class="mrow danger" data-m="leave">${ICON.exit}Leave seat</button>` : ""}
      <div class="note" style="padding:4px 2px">60 seconds per move. Two timeouts in a row and you're sat out automatically.</div>`;
  }
  if (sheet === "profile") {
    const st = stats(), av = myAv();
    return `<label class="lbl" for="nameIn">Name at the table</label><input id="nameIn" maxlength="16" placeholder="e.g. Harsha" value="${esc(myName())}">
      <label class="lbl">Avatar</label><div class="avgrid">${AVATARS.map(a => `<button data-av="${a}" class="${a === av ? "on" : ""}">${a}</button>`).join("")}</div>
      <label class="lbl">Your stats</label><div class="stats"><div><b>${st.played}</b><span>Hands</span></div><div><b>${st.won}</b><span>Won</span></div><div><b>${st.played ? Math.round(st.won / st.played * 100) : 0}%</b><span>Win rate</span></div><div><b>${fmt(st.biggest)}</b><span>Best pot</span></div></div>
      <button class="gold-btn" id="profSave" style="margin-top:6px">Save</button>`;
  }
  return "";
}
function bindSheet(host) {
  const on = (sel, ev, fn) => host.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on("[data-say]", "click", e => { sendChat(e.currentTarget.dataset.say); });
  const send = () => { const i = host.querySelector("#chatIn"); if (i && i.value.trim()) { sendChat(i.value); i.value = ""; } };
  on("#chatSend", "click", send);
  on("#chatIn", "keydown", e => { if (e.key === "Enter") send(); });
  on("[data-m]", "click", e => {
    const m = e.currentTarget.dataset.m;
    if (m === "invite") { invite(); closeSheet(); }
    else if (m === "sit") { toggleSitOut(); closeSheet(); }
    else if (m === "top") { topUp(); closeSheet(); }
    else if (m === "history" || m === "lb") openSheet(m);
    else if (m === "leave") { closeSheet(); leaveTable(); }
  });
  on("[data-av]", "click", e => { host.querySelectorAll("[data-av]").forEach(b => b.classList.remove("on")); e.currentTarget.classList.add("on"); });
  on("#profSave", "click", () => {
    const n = host.querySelector("#nameIn").value.trim().slice(0, 16);
    if (!n) return toast("Enter a name.");
    const a = host.querySelector("[data-av].on")?.dataset.av || myAv();
    store.set("fp-name", n); store.set("fp-av", a);
    closeSheet(); render(); toast("Profile saved.", true);
  });
}

/* ---------- Render loop ---------- */
let lastTurnKey = "", lastWinShown = -1, warned = "", preAct = null, preKey = "";
const preKeyNow = () => S ? `${S.handNo}:${S.street}` : "";
function render() {
  const active = document.activeElement?.id;
  if (S && tableCode) {
    const key = S.status === "playing" ? `${S.handNo}:${S.turn}:${S.turnAt}` : "";
    if (key && key !== lastTurnKey && S.players[S.turn]?.id === myId && !(preAct && preKey === preKeyNow())) sfx.turn();
    else if (key && lastTurnKey && key !== lastTurnKey) sfx.chip();
    if (prevSnap && prevSnap.handNo === S.handNo && S.board.length > prevSnap.boardLen) sfx.deal();
    if (S.status === "over" && S.handNo !== lastWinShown && (S.results?.winners || []).some(w => w.id === myId)) sfx.win();
    lastTurnKey = key;
  }
  $app.innerHTML = tableCode ? renderTable() : renderLobby();
  if (S && tableCode) {
    const bets = {};
    for (const p of S.players) { const s = layoutMap[p.id]; if (s && p.bet > 0) { const b = betPos(s.x, s.y); bets[p.id] = { amt: p.bet, x: b.x, y: b.y }; } }
    prevSnap = { code: S.code, handNo: S.handNo, status: S.status, boardLen: S.board.length, bets };
    if (S.status === "over") lastWinShown = S.handNo;
    trackStats();
  }
  if (active && document.getElementById(active) && active !== "raiseRange") document.getElementById(active).focus();
  if (sheet && sheet !== "chat" && sheet !== "profile") renderSheet();
  bind(); updateBadge(); renderBubbles(); tick(); runPreAction();
}

function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("profBtn", "click", () => openSheet("profile"));
  on("profBtn2", "click", () => openSheet("profile"));
  $app.querySelectorAll("[data-stake]").forEach(b => b.addEventListener("click", () => createTable(b.dataset.stake)));
  on("joinBtn", "click", () => joinTable(document.getElementById("codeIn").value));
  on("codeIn", "keydown", e => { if (e.key === "Enter") joinTable(e.target.value); });
  $app.querySelectorAll("[data-join]").forEach(b => b.addEventListener("click", () => joinTable(b.dataset.join)));
  on("lobbyBtn", "click", leaveView);
  on("copyBtn", "click", invite);
  on("chatBtn", "click", () => openSheet("chat"));
  on("lbBtn", "click", () => openSheet("lb"));
  on("menuBtn", "click", () => openSheet("menu"));
  on("sitBtn", "click", () => joinTable(tableCode));
  on("backBtn", "click", toggleSitOut);
  on("topBtn", "click", topUp);
  on("dealBtn", "click", () => mutate(tableCode, st => !canDeal(st) ? "Only the host can deal." : st.status === "playing" ? "__noop" : startHand(st)));
  $app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => doAct(b.dataset.act)));
  $app.querySelectorAll("[data-pre]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.pre;
    if (preAct === k && preKey === preKeyNow()) preAct = null; else { preAct = k; preKey = preKeyNow(); }
    $app.querySelectorAll("[data-pre]").forEach(x => x.classList.toggle("on", preAct === x.dataset.pre));
  }));
  on("raiseOpen", "click", () => { raiseOpen = true; raiseVal = 0; render(); });
  on("raiseCancel", "click", () => { raiseOpen = false; render(); });
  on("raiseRange", "input", e => { raiseVal = +e.target.value; updateRaiseLabel(); });
  $app.querySelectorAll("[data-amt]").forEach(b => b.addEventListener("click", () => { raiseVal = +b.dataset.amt; const r = document.getElementById("raiseRange"); if (r) r.value = raiseVal; updateRaiseLabel(); }));
  on("raiseGo", "click", () => { const v = raiseVal; raiseOpen = false; const me = S.players.find(p => p.id === myId); v >= me.bet + me.chips ? doAct("allin") : doAct("raise", v); });
}
function updateRaiseLabel() {
  const me = S.players.find(p => p.id === myId); const maxTo = me.bet + me.chips;
  document.getElementById("raiseAmt").textContent = fmt(raiseVal);
  document.getElementById("raiseGo").innerHTML = `${raiseVal >= maxTo ? "All-in" : S.currentBet ? "Raise" : "Bet"}<small>${fmt(raiseVal)}</small>`;
}

function runPreAction() {
  if (!preAct || !S || S.status !== "playing") return;
  if (preKey !== preKeyNow()) { preAct = null; return; }
  const p = S.players[S.turn];
  if (!p || p.id !== myId || busy) return;
  const toCall = S.currentBet - p.bet;
  let type = null;
  if (preAct === "checkfold") type = toCall <= 0 ? "check" : "fold";
  else if (preAct === "check") { if (toCall <= 0) type = "check"; else { preAct = null; sfx.turn(); return; } }
  else if (preAct === "callany") type = toCall <= 0 ? "check" : "call";
  preAct = null;
  if (type) setTimeout(() => doAct(type), 300);
}

/* ---------- Clock & automatic actions ---------- */
function tick() {
  if (!S || !tableCode) return;
  const left = timeLeft();
  const secs = Math.ceil(left / 1000);
  const C = 2 * Math.PI * 24;
  document.querySelectorAll("[data-ring]").forEach(el => {
    el.setAttribute("stroke-dashoffset", (C * (1 - left / TURN_MS)).toFixed(1));
    el.style.stroke = left < 10000 ? "var(--danger)" : left < 25000 ? "var(--warn)" : "var(--ok)";
  });
  document.querySelectorAll("[data-secs]").forEach(el => el.textContent = secs + "s");
  const cs = document.querySelector("[data-clocksecs]"); if (cs) cs.textContent = secs + "s";
  const cf = document.querySelector("[data-clockfill]"); if (cf) cf.style.width = (left / TURN_MS * 100).toFixed(1) + "%";
  const ck = document.querySelector("[data-clock]"); if (ck) ck.classList.toggle("warn", left < 10000);
  if (S.status === "playing" && S.players[S.turn]?.id === myId && left < 10000 && left > 0) {
    const k = `${S.handNo}:${S.turn}:${S.turnAt}`;
    if (warned !== k) { warned = k; sfx.warn(); }
  }
  const nh = document.querySelector("[data-nexthand]");
  if (nh && S.status === "over") nh.textContent = `Next hand in ${Math.max(0, Math.ceil(((S.overAt || 0) + NEXT_HAND_MS - now()) / 1000))}s`;
  autoActions();
}
setInterval(() => { tick(); renderBubbles(); }, 1000);

let autoKey = "";
function autoActions() {
  if (!S || !tableCode || busy || !online) return;
  if (S.status === "playing" && S.turnAt && now() > S.turnAt + TURN_MS + 1200) {
    const k = `t:${S.handNo}:${S.turn}:${S.turnAt}`;
    if (autoKey === k) return;
    autoKey = k;
    const turn = S.turn, turnAt = S.turnAt;
    mutate(tableCode, st => timeoutMove(st, turn, turnAt));
    return;
  }
  if (S.status === "over" && S.hostId === myId && now() > (S.overAt || 0) + NEXT_HAND_MS) {
    const k = `d:${S.handNo}`;
    if (autoKey === k) return;
    autoKey = k;
    const hn = S.handNo;
    mutate(tableCode, st => {
      if (st.status !== "over" || st.handNo !== hn) return "__noop";
      if (st.players.filter(p => !p.leaving && p.chips > 0 && !p.sittingOut).length < 2) return "__noop";
      return startHand(st);
    });
  }
}

/* ---------- Boot ---------- */
function fatal(title, text) {
  $app.innerHTML = `<div class="hero"><h1>Friends <span>Poker</span></h1><p>${esc(title)}</p></div><div class="dock"><div class="note">${esc(text)}</div><button class="gold-btn" onclick="location.reload()">Try again</button></div>`;
}
async function boot() {
  myId = store.get("fp-id");
  if (!myId) {
    const b = new Uint8Array(12); crypto.getRandomValues(b);
    myId = "p" + Array.from(b, x => "abcdefghijklmnopqrstuvwxyz0123456789"[x % 36]).join("");
    store.set("fp-id", myId);
  }
  if (!window.firebase || !firebase.database) return fatal("No internet connection", "Friends Poker needs the internet to reach your table. Connect to Wi-Fi or mobile data and try again.");
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.databaseURL) return fatal("Game server not set up", "This copy of the app has no game server configured.");
  firebase.initializeApp(cfg);
  rdb = firebase.database();
  rdb.ref(".info/serverTimeOffset").on("value", s => { skew = s.val() || 0; });
  rdb.ref(".info/connected").on("value", s => {
    const was = online; online = !!s.val();
    const bar = document.getElementById("offline"); if (bar) bar.hidden = online;
    if (was !== online && online && tableCode) toast("Back online.", true);
  });
  rdb.ref("tables").orderByChild("updatedAt").limitToLast(10).on("value", snap => {
    const a = []; snap.forEach(c => { const d = norm(c.val()); if (d) a.push(d); });
    openTables = a.reverse();
    if (!tableCode) render();
  }, () => {});
  const saved = store.get("fp-table");
  if (saved) {
    try {
      const d = norm((await tableRef(saved).once("value")).val());
      if (d && d.players.some(p => p.id === myId)) return enterTable(saved);
    } catch {}
    store.set("fp-table", null);
  }
  render();
}
boot();
})();
</script>
