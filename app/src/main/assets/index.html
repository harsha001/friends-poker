<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Friends Poker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Figtree:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: portrait card room. Oval felt table fills the middle with seats placed around its rail (you always at the bottom); your cards, shot clock and action buttons sit in a dock below. */
:root {
  --room: #07110d;
  --room-2: #0d1d16;
  --felt: #15553d;
  --felt-hi: #1f7353;
  --felt-lo: #0b3324;
  --rail: #4a2c16;
  --rail-hi: #7a4a26;
  --brass: #e2b65c;
  --brass-lo: #a77d2c;
  --ivory: #fbf7ec;
  --ink: #17181a;
  --suit-red: #c8302a;
  --text: #efe9da;
  --muted: #9cb1a5;
  --line: #234a3a;
  --panel: #0e1f18;
  --panel-2: #13291f;
  --fold: #b73a32;
  --call: #2f7fb0;
  --raise: #e2b65c;
  --danger: #ef6a5e;
  --ok: #7fd69a;
  --display: "Rozha One", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--text); font-family: var(--body); font-size: 15px;
  background:
    radial-gradient(120% 60% at 50% 0%, #143326 0%, transparent 60%),
    radial-gradient(90% 50% at 50% 100%, #0f2a1f 0%, transparent 70%),
    var(--room);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
  -webkit-user-select: none; user-select: none;
}
input { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 800; background: #1d3529; color: var(--text); letter-spacing: .01em; transition: transform .08s ease, filter .15s ease; }
button:active:not(:disabled) { transform: scale(.97); filter: brightness(1.1); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
.btn-gold { background: linear-gradient(180deg, #f0c873, var(--brass) 55%, var(--brass-lo)); color: #241805; box-shadow: 0 3px 0 #6e521b, 0 6px 14px rgba(0,0,0,.35); }
.btn-ghost { background: rgba(255,255,255,.04); border: 1px solid var(--line); }
input, select { background: #0a1913; border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; min-width: 0; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- Lobby ---------- */
.hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 0 6px; text-align: center; }
.fan { position: relative; height: 104px; width: 200px; margin-bottom: 4px; }
.fan .card { position: absolute; left: 50%; bottom: 0; transform-origin: 50% 150%; }
.fan .card:nth-child(1) { transform: translateX(-50%) rotate(-27deg); }
.fan .card:nth-child(2) { transform: translateX(-50%) rotate(-9deg); }
.fan .card:nth-child(3) { transform: translateX(-50%) rotate(9deg); }
.fan .card:nth-child(4) { transform: translateX(-50%) rotate(27deg); }
.logo { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: .95; margin: 0; color: var(--brass); text-shadow: 0 2px 0 #3d2b0b, 0 8px 24px rgba(226,182,92,.25); }
.logo span { color: var(--ivory); }
.tagline { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ivory); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 130px; min-width: 0; }
.tables { display: flex; flex-direction: column; gap: 8px; }
.tablerow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.05); }
.tablerow .tc { font-family: var(--mono); letter-spacing: .18em; color: var(--brass); font-weight: 600; }
.tablerow .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tablerow button { padding: 9px 14px; }
.empty { color: var(--muted); font-size: 14px; }
.note { color: var(--muted); font-size: 13px; }

/* ---------- Top bar ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.topbar .mini { font-family: var(--display); font-size: 22px; color: var(--brass); line-height: 1; }
.topbar .mini span { color: var(--ivory); }
.topbar .acts { display: flex; gap: 6px; }
.topbar button { padding: 8px 11px; font-size: 13px; border-radius: 10px; }
.codechip { font-family: var(--mono); letter-spacing: .18em; color: var(--brass); }

/* ---------- Table ---------- */
.tablewrap { position: relative; width: 100%; aspect-ratio: 5 / 6; max-height: 60vh; margin: 14px auto 0; }
.rail {
  position: absolute; inset: 7% 9%; border-radius: 50% / 46%;
  background: linear-gradient(160deg, var(--rail-hi), var(--rail) 45%, #2a180a);
  box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.15), inset 0 -3px 0 rgba(0,0,0,.4);
}
.felt {
  position: absolute; inset: 10.5% 13%; border-radius: 50% / 46%;
  background:
    radial-gradient(60% 45% at 50% 42%, var(--felt-hi) 0%, var(--felt) 55%, var(--felt-lo) 100%);
  box-shadow: inset 0 0 0 2px rgba(226,182,92,.35), inset 0 0 0 7px rgba(0,0,0,.12), inset 0 10px 40px rgba(0,0,0,.45);
  overflow: hidden;
}
.felt::after { content: ""; position: absolute; inset: 9% 11%; border-radius: 50% / 46%; border: 1.5px solid rgba(255,255,255,.07); }
.felt .watermark { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); font-family: var(--display); font-size: 18px; color: rgba(255,255,255,.08); white-space: nowrap; letter-spacing: .04em; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%); display: flex; flex-direction: column; align-items: center; gap: 7px; width: 58%; z-index: 2; }
.street { font-size: 10px; text-transform: uppercase; letter-spacing: .22em; color: rgba(255,255,255,.55); font-weight: 700; }
.board { display: flex; gap: 3px; justify-content: center; }
.board .card { width: 36px; height: 51px; }
.board .card .pip { font-size: 23px; }
.board .card .s1 { top: 18px; }
.potpill { display: inline-flex; align-items: center; gap: 7px; background: rgba(0,0,0,.35); border: 1px solid rgba(226,182,92,.35); padding: 4px 12px 4px 6px; border-radius: 999px; font-family: var(--mono); font-size: 14px; color: var(--ivory); font-weight: 600; }
.msg { min-height: 18px; text-align: center; font-size: 13px; color: var(--ivory); text-wrap: balance; max-width: 100%; }
.msg .win { color: var(--brass); font-weight: 800; }

/* Seats */
.seat { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; width: 84px; z-index: 3; }
.seat .cards { display: flex; height: 30px; margin-bottom: -10px; position: relative; z-index: 1; }
.seat .cards .card + .card { margin-left: -9px; }
.seat .cards .card:first-child { transform: rotate(-8deg); }
.seat .cards .card:last-child { transform: rotate(8deg); }
.avatar-wrap { position: relative; width: 52px; height: 52px; z-index: 2; }
.avatar { position: absolute; inset: 4px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  box-shadow: 0 0 0 2px rgba(0,0,0,.5), inset 0 -6px 10px rgba(0,0,0,.25), inset 0 3px 6px rgba(255,255,255,.25); }
.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: rgba(0,0,0,.35); }
.ring .fg { stroke: var(--ok); stroke-linecap: round; transition: stroke .3s; }
.seat .plate { margin-top: -6px; min-width: 76px; max-width: 92px; background: linear-gradient(180deg, #13241c, #0a1511); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 7px 7px 4px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.plate .nm { font-size: 11px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate .ch { font-family: var(--mono); font-size: 11px; color: var(--brass); font-weight: 600; }
.plate .st { font-size: 10px; color: var(--muted); min-height: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.turn .plate { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 18px rgba(226,182,92,.35); }
.seat.folded { opacity: .45; filter: grayscale(.6); }
.seat.winner .avatar { animation: glow 1.2s ease-in-out infinite alternate; }
.seat.out { opacity: .35; }
@keyframes glow { from { box-shadow: 0 0 0 2px var(--brass), 0 0 6px rgba(226,182,92,.5); } to { box-shadow: 0 0 0 3px var(--brass), 0 0 22px rgba(226,182,92,.9); } }
.dealer { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ddd 60%, #aaa); color: #111; font-size: 10px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.5); z-index: 4; transform: translate(-50%, -50%); }
.betchip { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ivory); background: rgba(0,0,0,.4); padding: 2px 6px 2px 2px; border-radius: 999px; z-index: 4; white-space: nowrap; }
.chip { width: 18px; height: 18px; border-radius: 50%; flex: none; position: relative;
  background: repeating-conic-gradient(from 8deg, #fff 0 18deg, var(--c, #c8302a) 18deg 60deg);
  box-shadow: 0 0 0 1px rgba(0,0,0,.45), 0 2px 3px rgba(0,0,0,.5); }
.chip::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--c, #c8302a); box-shadow: 0 0 0 1.5px rgba(255,255,255,.85), inset 0 1px 2px rgba(0,0,0,.35); }
.chip.lg { width: 22px; height: 22px; }
.float { position: absolute; transform: translate(-50%, -50%); font-family: var(--mono); font-weight: 700; color: var(--brass); font-size: 14px; z-index: 6; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,.8); animation: floatup 2.4s ease-out forwards; }
@keyframes floatup { 0% { opacity: 0; margin-top: 0; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -40px; } }

/* Cards */
.card { width: 40px; height: 56px; border-radius: 6px; position: relative; flex: none; color: var(--ink);
  background: linear-gradient(160deg, #ffffff, var(--ivory) 60%, #ece5d2);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 3px 6px rgba(0,0,0,.45); font-family: var(--display); overflow: hidden; }
.card .r { position: absolute; top: 3px; left: 4px; font-size: 16px; line-height: 1; letter-spacing: -.04em; }
.card .s1 { position: absolute; top: 19px; left: 5px; font-size: 11px; line-height: 1; font-family: system-ui, sans-serif; }
.card .pip { position: absolute; right: 3px; bottom: 1px; font-size: 26px; line-height: 1; font-family: system-ui, sans-serif; }
.card.red { color: var(--suit-red); }
.card.slot { background: rgba(0,0,0,.18); border: 1.5px dashed rgba(255,255,255,.18); box-shadow: none; }
.card.back { background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.12) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.12) 0 2px, transparent 2px 7px),
    linear-gradient(160deg, #a2302a, #6c1a16);
  border: 2.5px solid #fbf7ec; }
.card.back::after { content: ""; position: absolute; inset: 4px; border: 1px solid rgba(255,255,255,.35); border-radius: 3px; }
.card.xs { width: 22px; height: 31px; border-radius: 4px; border-width: 1.5px; }
.card.xs::after { inset: 2px; }
.card.sm { width: 28px; height: 39px; border-radius: 4px; }
.card.sm .r { font-size: 12px; top: 2px; left: 3px; }
.card.sm .s1 { display: none; }
.card.sm .pip { font-size: 16px; right: 2px; bottom: 1px; }
.card.lg { width: 66px; height: 92px; border-radius: 9px; }
.card.lg .r { font-size: 28px; top: 5px; left: 7px; }
.card.lg .s1 { font-size: 17px; top: 34px; left: 8px; }
.card.lg .pip { font-size: 44px; right: 5px; bottom: 2px; }
.card.hl { box-shadow: 0 0 0 2.5px var(--brass), 0 0 14px rgba(226,182,92,.55), 0 3px 6px rgba(0,0,0,.45); }
.card.dim { filter: brightness(.6); }

/* ---------- Dock ---------- */
.dock { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -6px 24px rgba(0,0,0,.25); }
.dock .head { display: flex; gap: 14px; align-items: center; }
.dock .hole { display: flex; gap: 6px; }
.dock .hole .card:first-child { transform: rotate(-4deg); }
.dock .hole .card:last-child { transform: rotate(4deg); }
.dock .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.dock .strength { font-family: var(--display); font-size: 21px; color: var(--ivory); line-height: 1.1; }
.dock .stack { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.clock { display: flex; flex-direction: column; gap: 5px; }
.clock .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 700; }
.clock .lbl b { font-family: var(--mono); color: var(--ivory); }
.clock .track { height: 7px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; }
.clock .fill { height: 100%; background: linear-gradient(90deg, var(--ok), #c6e07a); border-radius: 99px; transition: width 1s linear, background .3s; }
.clock.warn .fill { background: linear-gradient(90deg, #f0a24a, var(--danger)); }
.clock.warn .lbl b { color: var(--danger); }
.bar { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; }
.bar button { padding: 15px 6px; font-size: 15px; border-radius: 14px; }
.b-fold { background: linear-gradient(180deg, #cf4b42, var(--fold)); color: #fff; box-shadow: 0 3px 0 #6b1d18; }
.b-call { background: linear-gradient(180deg, #4597c8, var(--call)); color: #fff; box-shadow: 0 3px 0 #1a4a69; }
.b-raise { background: linear-gradient(180deg, #f0c873, var(--raise) 55%, var(--brass-lo)); color: #241805; box-shadow: 0 3px 0 #6e521b; }
.raise { display: flex; flex-direction: column; gap: 10px; }
.raise .quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.raise .quick button { padding: 9px 4px; font-size: 13px; }
.raise input[type=range] { padding: 0; accent-color: var(--brass); height: 28px; }
.raise .amt { display: flex; justify-content: space-between; align-items: center; }
.raise .amt b { font-family: var(--mono); font-size: 22px; color: var(--brass); }
.hostbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hostbar > * { flex: 1 1 140px; }
.log { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; padding-top: 6px; }
.log div:first-child { color: var(--text); }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }

.offline { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 30; background: #5a2420; color: #ffe1dc; text-align: center; font-size: 13px; font-weight: 700; padding: 6px max(16px, env(safe-area-inset-left, 0px)); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: #3a1d1a; color: #ffe1dc; border: 1px solid var(--danger);
  padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
.toast.ok { background: #183524; color: #dff7e6; border-color: var(--ok); }
@media (prefers-reduced-motion: no-preference) {
  .card.deal { animation: deal .35s cubic-bezier(.2,.8,.3,1.2) both; }
  .board .card.deal:nth-child(2) { animation-delay: .07s; }
  .board .card.deal:nth-child(3) { animation-delay: .14s; }
  @keyframes deal { from { transform: translateY(-24px) rotate(-10deg) scale(.8); opacity: 0; } }
  .seat.turn .avatar-wrap { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-2px); } }
}
@media (max-width: 400px) {
  .card { width: 34px; height: 48px; }
  .board .card { width: 32px; height: 46px; } .board .card .pip { font-size: 19px; }
  .card .r { font-size: 14px; } .card .s1 { top: 16px; font-size: 10px; } .card .pip { font-size: 21px; }
  .seat { width: 74px; }
  .seat .plate { min-width: 66px; max-width: 78px; padding: 6px 5px 3px; }
  .avatar-wrap { width: 46px; height: 46px; }
  .avatar { font-size: 14px; }
  .card.lg { width: 58px; height: 81px; }
  .card.lg .pip { font-size: 38px; } .card.lg .r { font-size: 24px; } .card.lg .s1 { top: 30px; }
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<body>
<div class="offline" id="offline" hidden>Offline · reconnecting…</div>
<div class="wrap" id="app">
  <div class="hero"><h1 class="logo">Friends<br><span>Poker</span></h1><div class="tagline">Shuffling up… connecting to the card room.</div></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>

(() => {
"use strict";
const RANKS = "23456789TJQKA";
const SUITS = { s: "♠", h: "♥", d: "♦", c: "♣" };
const HAND_NAMES = ["High card","Pair","Two pair","Three of a kind","Straight","Flush","Full house","Four of a kind","Straight flush"];
const MAX_PLAYERS = 9;
const TURN_MS = 60000;       // shot clock per move
const NEXT_HAND_MS = 7000;   // pause between hands before the host's app deals again
let skew = 0;                // phone clock vs Firebase server clock
const now = () => Date.now() + skew;

let rdb = null, myId = null, online = true;
let tableCode = null, S = null, unsubTable = null, unsubList = null, openTables = [];
let raiseOpen = false, raiseVal = 0, busy = false, lastHandRendered = -1;

const $app = document.getElementById("app");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US");

function toast(text, ok) {
  const t = document.getElementById("toast");
  t.textContent = text; t.className = "toast" + (ok ? " ok" : ""); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- Hand evaluation ---------- */
const rv = c => RANKS.indexOf(c[0]) + 2;
function eval5(cs) {
  const v = cs.map(rv).sort((a, b) => b - a);
  const flush = cs.every(c => c[1] === cs[0][1]);
  const uniq = [...new Set(v)];
  let straightHigh = 0;
  if (uniq.length === 5) {
    if (v[0] - v[4] === 4) straightHigh = v[0];
    else if (v.join() === "14,5,4,3,2") straightHigh = 5;
  }
  const cnt = {}; v.forEach(x => cnt[x] = (cnt[x] || 0) + 1);
  const groups = Object.entries(cnt).map(([k, n]) => [n, +k]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
  const kick = groups.map(g => g[1]);
  if (straightHigh && flush) return [8, straightHigh];
  if (groups[0][0] === 4) return [7, ...kick];
  if (groups[0][0] === 3 && groups[1][0] === 2) return [6, ...kick];
  if (flush) return [5, ...v];
  if (straightHigh) return [4, straightHigh];
  if (groups[0][0] === 3) return [3, ...kick];
  if (groups[0][0] === 2 && groups[1][0] === 2) return [2, ...kick];
  if (groups[0][0] === 2) return [1, ...kick];
  return [0, ...v];
}
function cmp(a, b) { for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; }
function best(cards) {
  if (cards.length < 5) return null;
  let top = null, topCards = null;
  const n = cards.length;
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let c = b + 1; c < n; c++) for (let d = c + 1; d < n; d++) for (let e = d + 1; e < n; e++) {
    const five = [cards[a], cards[b], cards[c], cards[d], cards[e]];
    const s = eval5(five);
    if (!top || cmp(s, top) > 0) { top = s; topCards = five; }
  }
  return { score: top, cards: topCards, name: HAND_NAMES[top[0]] };

function partialName(cards) {
  const v = cards.map(rv);
  if (cards.length === 2) return v[0] === v[1] ? "Pocket pair" : (cards[0][1] === cards[1][1] ? "Suited" : "Offsuit");
  return "";
}

/* ---------- Game engine (pure state mutations) ---------- */
function newDeck() {
  const d = [];
  for (const r of RANKS) for (const s of "shdc") d.push(r + s);
  const rnd = new Uint32Array(d.length); crypto.getRandomValues(rnd);
  for (let i = d.length - 1; i > 0; i--) { const j = rnd[i] % (i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
const canAct = p => p.inHand && !p.folded && !p.allIn;
const live = p => p.inHand && !p.folded;
function nextIdx(S, from, pred) {
  const n = S.players.length;
  for (let k = 1; k <= n; k++) { const i = ((from + k) % n + n) % n; if (pred(S.players[i])) return i; }
  return -1;
}
const dealerIdx = S => S.players.findIndex(p => p.id === S.dealerId);
function put(p, a) { a = Math.max(0, Math.min(a, p.chips)); p.chips -= a; p.bet += a; p.total += a; if (p.chips === 0) p.allIn = true; return a; }
function log(S, text) { S.log = [text, ...(S.log || [])].slice(0, 30); }
const potOf = S => S.players.reduce((t, p) => t + (p.total || 0), 0);

function startHand(S) {
  S.players = S.players.filter(p => !p.leaving);
  const ready = S.players.filter(p => p.chips > 0);
  if (ready.length < 2) return "Need at least 2 players with chips to deal.";
  for (const p of S.players) Object.assign(p, { hole: [], inHand: p.chips > 0, folded: false, allIn: false, bet: 0, total: 0, acted: false, last: "" });
  const prev = dealerIdx(S);
  const d = nextIdx(S, prev === -1 ? -1 : prev, p => p.inHand);
  S.dealerId = S.players[d].id;
  const headsUp = ready.length === 2;
  const sb = headsUp ? d : nextIdx(S, d, p => p.inHand);
  const bb = nextIdx(S, sb, p => p.inHand);
  put(S.players[sb], S.sb); S.players[sb].last = "SB " + S.sb;
  put(S.players[bb], S.bb); S.players[bb].last = "BB " + S.bb;
  S.deck = newDeck();
  let i = d;
  for (let round = 0; round < 2; round++) for (let k = 0; k < ready.length; k++) { i = nextIdx(S, i, p => p.inHand); S.players[i].hole.push(S.deck.pop()); }
  S.board = []; S.street = "preflop"; S.status = "playing"; S.handNo = (S.handNo || 0) + 1;
  S.currentBet = Math.max(...S.players.map(p => p.bet)); S.minRaise = S.bb;
  S.results = null; S.message = "";
  log(S, `Hand #${S.handNo} dealt · ${S.players[d].name} has the button`);
  S.turn = nextIdx(S, bb, canAct);
  S.turnAt = now();
  if (S.turn === -1 || S.players.filter(canAct).length === 0) progress(S, bb);
  return null;
}

function act(S, pid, type, amount) {
  if (S.status !== "playing") return "No hand in progress.";
  const p = S.players[S.turn];
  if (!p || p.id !== pid) return "It's not your turn.";
  const toCall = S.currentBet - p.bet;
  const raiseTo = target => {
    const inc = target - S.currentBet;
    if (inc >= S.minRaise) S.minRaise = inc;
    S.currentBet = target;
    put(p, target - p.bet);
    for (const o of S.players) if (o !== p && canAct(o)) o.acted = false;
    p.last = p.allIn ? `All-in ${fmt(p.bet)}` : `Raise to ${fmt(target)}`;
  };
  if (type === "fold") { p.folded = true; p.last = "Fold"; }
  else if (type === "check") { if (toCall > 0) return `You need to call ${fmt(toCall)} or fold.`; p.last = "Check"; }
  else if (type === "call") {
    if (toCall <= 0) { p.last = "Check"; }
    else { put(p, toCall); p.last = p.allIn ? `All-in ${fmt(p.bet)}` : `Call ${fmt(toCall)}`; }
  }
  else if (type === "raise") {
    const max = p.bet + p.chips, min = S.currentBet + S.minRaise;
    amount = Math.floor(amount);
    if (!(amount > S.currentBet)) return "A raise must be more than the current bet.";
    if (amount > max) return `You only have ${fmt(max)} total.`;
    if (amount < min && amount < max) return `Minimum raise is to ${fmt(min)}.`;
    raiseTo(amount);
  }
  else if (type === "allin") {
    const target = p.bet + p.chips;
    if (target <= S.currentBet) { put(p, p.chips); p.last = `All-in ${fmt(p.bet)}`; }
    else raiseTo(target);
  }
  else return "Unknown action.";
  p.acted = true;
  log(S, `${p.name}: ${p.last}`);
  progress(S, S.turn);
  return null;
}

function progress(S, from) {
  const liveP = S.players.filter(live);
  if (liveP.length === 1) return winByFold(S, liveP[0]);
  const actors = S.players.filter(canAct);
  const done = actors.length === 0
    || actors.every(p => p.acted && p.bet === S.currentBet)
    || (actors.length === 1 && actors[0].bet >= S.currentBet && S.players.filter(live).every(p => p.allIn || p === actors[0]));
  if (!done) {
    S.turn = nextIdx(S, from, p => canAct(p) && (!p.acted || p.bet < S.currentBet));
    S.turnAt = now();
    return;
  }
  const deal = () => {
    for (const p of S.players) { p.bet = 0; p.acted = false; if (live(p) && !p.allIn) p.last = ""; }
    S.currentBet = 0; S.minRaise = S.bb;
    S.deck.pop(); // burn
    if (S.street === "preflop") { S.board.push(S.deck.pop(), S.deck.pop(), S.deck.pop()); S.street = "flop"; }
    else if (S.street === "flop") { S.board.push(S.deck.pop()); S.street = "turn"; }
    else if (S.street === "turn") { S.board.push(S.deck.pop()); S.street = "river"; }
  };
  if (S.street === "river") return showdown(S);
  deal();
  while (S.players.filter(canAct).length < 2 && S.street !== "river") deal();
  if (S.players.filter(canAct).length < 2) return showdown(S);
  S.turn = nextIdx(S, dealerIdx(S), canAct);
  S.turnAt = now();
}

function winByFold(S, w) {
  const pot = potOf(S);
  w.chips += pot;
  for (const p of S.players) p.bet = 0;
  S.results = { reveal: false, winners: [{ id: w.id, amount: pot, hand: "" }], hands: {} };
  S.message = `${w.name} wins ${fmt(pot)}`;
  log(S, `${w.name} wins ${fmt(pot)} (everyone else folded)`);
  S.status = "over"; S.turn = -1; S.overAt = now();
}

function showdown(S) {
  for (const p of S.players) p.bet = 0;
  const hands = {};
  for (const p of S.players.filter(live)) hands[p.id] = best([...p.hole, ...S.board]);
  const contribs = S.players.filter(p => p.total > 0);
  const levels = [...new Set(contribs.map(p => p.total))].sort((a, b) => a - b);
  const won = {};
  let prev = 0;
  const order = []; // seat order starting left of dealer, for odd chips
  let i = dealerIdx(S);
  for (let k = 0; k < S.players.length; k++) { i = (i + 1) % S.players.length; order.push(S.players[i].id); }
  for (const lvl of levels) {
    const amount = contribs.reduce((t, p) => t + Math.max(0, Math.min(p.total, lvl) - prev), 0);
    let elig = S.players.filter(p => live(p) && p.total >= lvl);
    if (!elig.length) elig = S.players.filter(live);
    let top = null, ws = [];
    for (const p of elig) { const c = top ? cmp(hands[p.id].score, top) : 1; if (c > 0) { top = hands[p.id].score; ws = [p]; } else if (c === 0) ws.push(p); }
    ws.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    const share = Math.floor(amount / ws.length);
    let rem = amount - share * ws.length;
    for (const w of ws) { const a = share + (rem-- > 0 ? 1 : 0); won[w.id] = (won[w.id] || 0) + a; }
    prev = lvl;
  }
  const winners = Object.entries(won).map(([id, amount]) => {
    const p = S.players.find(x => x.id === id); p.chips += amount;
    return { id, amount, hand: hands[id].name };
  });
  const handInfo = {};
  for (const [id, h] of Object.entries(hands)) handInfo[id] = { name: h.name, cards: h.cards };
  S.results = { reveal: true, winners, hands: handInfo };
  S.message = winners.map(w => `${S.players.find(p => p.id === w.id).name} wins ${fmt(w.amount)} with ${w.hand.toLowerCase()}`).join(" · ");
  log(S, S.message);
  S.status = "over"; S.turn = -1; S.overAt = now();
}

/* ---------- Store (Firebase Realtime Database) ---------- */
const arr = v => Array.isArray(v) ? v.filter(x => x != null)
  : (v && typeof v === "object") ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]).filter(x => x != null) : [];

  if (!d) return null;
  d.players = arr(d.players).map(p => Object.assign({ hole: [], inHand: false, folded: false, allIn: false, bet: 0, total: 0, acted: false, last: "", chips: 0 }, p, { hole: arr(p.hole) }));
  d.board = arr(d.board); d.deck = arr(d.deck); d.log = arr(d.log);
  if (d.turn == null) d.turn = -1;
  if (d.dealerId === undefined) d.dealerId = null;
  if (d.results) {
    d.results.winners = arr(d.results.winners);
    const h = d.results.hands || {};
    for (const k in h) h[k].cards = arr(h[k].cards);
    d.results.hands = h;
  }

}
const clean = o => JSON.parse(JSON.stringify(o));
const tableRef = code => rdb.ref("tables/" + code);

function mutate(code, fn) {
  if (busy) return Promise.resolve();
  busy = true;
  let err = null;
  return tableRef(code).transaction(cur => {
    err = null;
    if (cur === null) return null;
    const st = norm(clean(cur));
    err = fn(st);
    if (err) return; // abort (also for "__noop")
    st.updatedAt = now();
    return clean(st);
  }, null, false).then(() => { if (err && err !== "__noop") toast(err); })
    .catch(() => toast(online ? "Couldn't save that move. Try again." : "You're offline. Reconnect and try again."))
    .finally(() => { busy = false; });
}

function myName() { return (store.get("fp-name") || "").trim().slice(0, 18); }

async function createTable() {
  const name = myName(); if (!name) return toast("Enter your name first.");
  const chips = +document.getElementById("startChips").value;
  const [sb, bb] = document.getElementById("blinds").value.split("/").map(Number);
  try {
    let code;
    for (let i = 0; i < 6; i++) {
      code = Array.from({ length: 4 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random() * 24)]).join("");
      const s = await tableRef(code).once("value"); if (!s.exists()) break;
    }
    const st = {
      code, hostId: myId, startChips: chips, sb, bb, status: "lobby", handNo: 0, dealerId: null, turn: -1,
      players: [{ id: myId, name, chips, hole: [], inHand: false, folded: false, allIn: false, bet: 0, total: 0, acted: false, last: "" }],
      board: [], deck: [], log: [`${name} opened the table`], updatedAt: now(), createdAt: now()
    };
    await tableRef(code).set(clean(st));
    enterTable(code);
  } catch { toast("Couldn't create the table. Check your internet and try again."); }
}

async function joinTable(code) {
  code = (code || "").toUpperCase().replace(/[^A-Z]/g, "");
  const name = myName(); if (!name) return toast("Enter your name first.");
  if (code.length !== 4) return toast("Table codes are 4 letters.");
  let d;
  try { d = norm((await tableRef(code).once("value")).val()); }
  catch { return toast("Couldn't reach the table. Check your internet."); }
  if (!d) return toast(`No table with code ${code}.`);
  if (!d.players.some(p => p.id === myId)) {
    await mutate(code, st => {
      if (st.players.some(p => p.id === myId)) return null;
      if (st.players.length >= MAX_PLAYERS) return "That table is full (9 players).";
      st.players.push({ id: myId, name, chips: st.startChips, hole: [], inHand: false, folded: false, allIn: false, bet: 0, total: 0, acted: false, last: "" });
      log(st, `${name} sat down`);
      return null;
    });
  }
  enterTable(code);
}

function enterTable(code) {
  tableCode = code; store.set("fp-table", code);
  if (unsubTable) unsubTable();
  S = null; raiseOpen = false;
  render();
  const ref = tableRef(code);
  const cb = snap => {
    const d = norm(snap.val());
    if (!d) { leaveView(); toast("The table was closed."); return; }
    if (S && (S.handNo !== d.handNo || S.turn !== d.turn)) raiseOpen = false;
    S = d; render();
  };
  ref.on("value", cb, () => toast("Lost connection to the table. Reopen the app."));

}
function leaveView() { if (unsubTable) unsubTable(); unsubTable = null; tableCode = null; S = null; store.set("fp-table", null); render(); }

async function leaveTable() {
  const code = tableCode;
  await mutate(code, st => {
    const i = st.players.findIndex(p => p.id === myId);
    if (i === -1) return null;
    const p = st.players[i];
    log(st, `${p.name} left the table`);
    if (st.status === "playing" && p.inHand) {
      if (live(p)) { p.folded = true; p.last = "Left"; }
      p.leaving = true;
      if (st.turn === i) progress(st, i);
      else { const l = st.players.filter(live); if (l.length === 1) winByFold(st, l[0]); }
    } else st.players.splice(i, 1);
    const remaining = st.players.filter(x => !x.leaving);
    if (st.hostId === myId && remaining.length) st.hostId = remaining[0].id;
    return null;
  });
  leaveView();
}

let actx = null;
function beep(freq = 660, dur = 0.12, type = "sine", vol = 0.08) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch {}
}

function avColor(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }

/* ---------- Table ---------- */
function seatLayout(n, meIdx) {
  // Returns [{idx, x, y}] in percent of the table box; you sit at the bottom.
  const out = [];
  const rx = 41, ry = 41, cx = 50, cy = 49;
  for (let k = 0; k < n; k++) {
    const idx = meIdx >= 0 ? (meIdx + k) % n : k;
    const a = Math.PI / 2 + k * 2 * Math.PI / n;
    out.push({ idx, x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
  }
  return out;
}

function renderTable() {
  if (!S) return `<div class="hero"><h1 class="logo">Friends <span>Poker</span></h1><div class="tagline">Taking your seat at ${esc(tableCode)}…</div></div>`;

  const isHost = S.hostId === myId;

  const fresh = S.handNo !== lastHandRendered;
  const boardFresh = (S.board || []).length !== lastBoardLen;

  const board = [0,1,2,3,4].map(i => {
    const c = S.board[i];
    const used = S.status === "over" && S.results?.reveal && c && (S.results.winners || []).some(w => S.results.hands[w.id]?.cards.includes(c));
    return cardHTML(c, (c && (fresh || (boardFresh && i >= lastBoardLen)) ? "deal " : "") + (used ? "hl" : ""));
  }).join("");

  let msg = "";
  if (S.status === "lobby") msg = S.players.length < 2 ? "Tap Invite to send friends the code." : (isHost ? "Everyone in? Deal the first hand." : "Waiting for the host to deal.");
  else if (S.status === "over") msg = `<span class="win">${esc(S.message)}</span>`;
  else if (turnP) msg = turnP.id === myId ? "Your move" : `${esc(turnP.name)} is thinking…`;

  const lay = seatLayout(S.players.length, meIdx);
  const C = 2 * Math.PI * 23;
  let seats = "", extras = "";
  for (const { idx, x, y } of lay) {
    const p = S.players[idx];
    const isMe = p.id === myId;
    const showFace = S.status === "over" && S.results?.reveal && live(p) && !isMe;
    let cards = "";
    if (showFace) cards = p.hole.map(c => cardHTML(c, "sm" + (winnerIds.has(p.id) && S.results.hands[p.id]?.cards.includes(c) ? " hl" : ""))).join("");
    else if (!isMe && live(p) && S.status !== "lobby") cards = cardHTML("back", "xs" + (fresh ? " deal" : "")) + cardHTML("back", "xs" + (fresh ? " deal" : ""));
    const isTurn = turnP && turnP.id === p.id;
    const frac = isTurn ? timeLeft() / TURN_MS : 1;
    const ring = isTurn ? `<svg class="ring" viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="23"/><circle class="fg" data-ring cx="26" cy="26" r="23" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"/></svg>` : "";
    const handName = S.status === "over" && S.results?.reveal && live(p) ? S.results.hands[p.id]?.name : "";
    let status = handName || p.last || "";
    if (!p.inHand && S.status === "playing") status = p.chips ? "Next hand" : "Out of chips";
    if (isTurn) status = `<span class="mono" data-secs>${Math.ceil(timeLeft() / 1000)}s</span>`;
    else status = esc(status);
    seats += `<div class="seat ${isTurn ? "turn" : ""} ${p.inHand && p.folded ? "folded" : ""} ${winnerIds.has(p.id) ? "winner" : ""} ${!p.chips && !p.inHand ? "out" : ""}" style="left:${x}%;top:${y}%">
      <div class="cards">${cards}</div>
      <div class="avatar-wrap">${ring}<div class="avatar" style="background:${avColor(p.id)}">${esc(initials(p.name))}</div></div>
      <div class="plate"><div class="nm">${esc(isMe ? "You" : p.name)}</div><div class="ch">${fmt(p.chips)}</div><div class="st">${status}</div></div>
    </div>`;
    // bet chips and dealer button sit between the seat and the table centre
    const dd = Math.hypot(50 - x, 49 - y) || 1, kk = Math.min(0.6, 16 / dd);
    let bx = x + (50 - x) * kk, by = y + (49 - y) * kk;
    if (bx > 20 && bx < 80 && by > 42 && by < 63) by = by < 52 ? 41 : 65; // keep clear of the board
    if (p.bet > 0) extras += `<div class="betchip" style="left:${bx}%;top:${by}%">${chipHTML(p.bet)}${fmt(p.bet)}</div>`;
    if (idx === dIdx && S.status !== "lobby") {
      const dx = x + (x <= 50 ? 15 : -15), dy = y + 4;
      extras += `<div class="dealer" style="left:${dx}%;top:${dy}%">D</div>`;
    }
    if (winnerIds.has(p.id) && fresh === false && S.handNo !== lastWinShown) {
      const w = S.results.winners.find(w => w.id === p.id);
      extras += `<div class="float" style="left:${x}%;top:${y - 12}%">+${fmt(w.amount)}</div>`;
    }
  }

  // Dock
  let dock = "";
  if (!me) {
    dock = `<div class="dock"><div class="note">You're watching this table.</div><button class="btn-gold" id="sitBtn">Sit down</button></div>`;
  } else {
    const hole = me.hole && me.inHand ? me.hole : [];
    const bh = hole.length && S.board.length >= 3 ? best([...hole, ...S.board]) : null;
    const strength = me.folded && me.inHand ? "Folded" : bh ? bh.name : (hole.length === 2 ? partialName(hole) : (S.status === "playing" ? "Sitting this hand out" : S.status === "over" ? "Hand over" : "Waiting for the deal"));
    dock = `<div class="dock">
      <div class="head">
        <div class="hole">${hole.length ? hole.map(c => cardHTML(c, "lg" + (fresh ? " deal" : "") + (bh && bh.cards.includes(c) ? " hl" : "") + (me.folded ? " dim" : ""))).join("") : cardHTML(null, "lg") + cardHTML(null, "lg")}</div>
        <div class="info"><div class="strength">${esc(strength)}</div><div class="stack mono">${chipHTML(me.chips, "lg")}${fmt(me.chips)}${me.bet ? ` · in pot ${fmt(me.bet)}` : ""}</div></div>
      </div>
      ${actionBar(me)}
      ${hostBar(me, isHost)}
    </div>`;
  }

  return `
  <div class="topbar">
    <div class="mini">Friends <span>Poker</span></div>
    <div class="acts"><button class="btn-ghost" id="copyBtn">Invite · <span class="codechip">${esc(S.code)}</span></button><button class="btn-ghost" id="leaveBtn">Leave</button></div>
  </div>
  <div class="tablewrap">
    <div class="rail"></div>
    <div class="felt"><div class="watermark">Friends Poker</div></div>
    <div class="center">
      <div class="street">${esc(streetLabel)} · ${S.sb}/${S.bb}${S.handNo ? ` · #${S.handNo}` : ""}</div>
      <div class="potpill">${chipHTML(pot, "lg")}${fmt(pot)}</div>
      <div class="board">${board}</div>
      <div class="msg">${msg}</div>
    </div>
    ${extras}
    ${seats}
  </div>
  ${dock}
  <details><summary>Table log</summary><div class="log">${(S.log || []).slice(0, 12).map(l => `<div>${esc(l)}</div>`).join("")}</div></details>`;
}

function actionBar(me) {
  if (S.status !== "playing") return "";
  const myTurn = S.players[S.turn]?.id === myId;
  if (!myTurn) return me.inHand && !me.folded && !me.allIn ? `<div class="note">Waiting for ${esc(S.players[S.turn]?.name || "")}…</div>` : "";
  const left = timeLeft();
  const clock = `<div class="clock ${left < 10000 ? "warn" : ""}" data-clock><div class="lbl"><span>Your turn</span><b data-clocksecs>${Math.ceil(left / 1000)}s</b></div><div class="track"><div class="fill" data-clockfill style="width:${(left / TURN_MS * 100).toFixed(1)}%"></div></div></div>`;
  const toCall = S.currentBet - me.bet;
  const maxTo = me.bet + me.chips;
  const minTo = Math.min(S.currentBet + S.minRaise, maxTo);
  const canRaise = maxTo > S.currentBet;
  if (raiseOpen && canRaise) {
    raiseVal = Math.max(minTo, Math.min(raiseVal || minTo, maxTo));
    const pot = potOf(S);
    const half = Math.min(maxTo, Math.max(minTo, S.currentBet + Math.floor((pot + toCall) / 2)));
    const full = Math.min(maxTo, Math.max(minTo, S.currentBet + pot + toCall));
    return `${clock}<div class="raise">
      <div class="amt"><span class="note">${S.currentBet ? "Raise to" : "Bet"}</span><b id="raiseAmt">${fmt(raiseVal)}</b></div>
      <input type="range" id="raiseRange" min="${minTo}" max="${maxTo}" step="${S.bb >= 10 ? Math.min(S.bb / 2, 10) : 1}" value="${raiseVal}" aria-label="Raise amount">
      <div class="quick"><button data-amt="${minTo}">Min</button><button data-amt="${half}">½ pot</button><button data-amt="${full}">Pot</button><button data-amt="${maxTo}">All-in</button></div>
      <div class="bar" style="grid-template-columns:1fr 2fr"><button class="btn-ghost" id="raiseCancel">Back</button><button class="b-raise" id="raiseGo">${raiseVal >= maxTo ? "All-in " + fmt(maxTo) : (S.currentBet ? "Raise to " : "Bet ") + fmt(raiseVal)}</button></div>
    </div>`;
  }
  const callLabel = toCall <= 0 ? "Check" : toCall >= me.chips ? `All-in ${fmt(me.chips)}` : `Call ${fmt(toCall)}`;
  return `${clock}<div class="bar">
    <button class="b-fold" data-act="fold">Fold</button>
    <button class="b-call" data-act="${toCall <= 0 ? "check" : "call"}">${callLabel}</button>
    <button class="b-raise" id="raiseOpen" ${canRaise && toCall < me.chips ? "" : "disabled"}>${S.currentBet ? "Raise" : "Bet"}</button>
  </div>`;
}

function canDeal(st) { return st.hostId === myId || (st.status === "over" && now() > (st.overAt || 0) + 30000); }

function hostBar(me, isHost) {
  const b = [];
  if (S.status !== "playing") {
    if (S.status === "over" && isHost) b.push(`<div class="note" data-nexthand>Next hand starting soon…</div><button class="btn-gold" id="dealBtn">Deal now</button>`);
    else if (canDeal(S)) b.push(`<button class="btn-gold" id="dealBtn">${S.status === "lobby" ? "Deal first hand" : "Deal next hand"}</button>`);
    else b.push(`<div class="note">${S.status === "over" ? "Next hand starting soon…" : ""}</div>`);
    if (me.chips === 0) b.push(`<button id="rebuyBtn">Rebuy ${fmt(S.startChips)} chips</button>`);
  }
  return b.length ? `<div class="hostbar">${b.join("")}</div>` : "";
}

let lastTurnKey = "", lastBoardLen = 0, lastWinShown = -1, warned = "";
function render() {
  const active = document.activeElement?.id;
  // sounds on state changes
  if (S && tableCode) {
    const key = S.status === "playing" ? `${S.handNo}:${S.turn}:${S.turnAt}` : "";
    if (key && key !== lastTurnKey) {
      if (S.players[S.turn]?.id === myId) sfx.turn(); else if (lastTurnKey) sfx.chip();
    }
    if ((S.board || []).length > lastBoardLen && S.handNo === lastHandRendered) sfx.deal();
    if (S.status === "over" && S.handNo !== lastWinShown && (S.results?.winners || []).some(w => w.id === myId)) sfx.win();
    lastTurnKey = key;
  }
  $app.innerHTML = tableCode ? renderTable() : renderLobby();
  if (S) {
    lastHandRendered = S.handNo; lastBoardLen = (S.board || []).length;
    if (S.status === "over") lastWinShown = S.handNo;
  }
  if (active && document.getElementById(active) && active !== "raiseRange") document.getElementById(active).focus();
  bind(); tick();
}

function bind() {
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
  on("nameIn", "input", e => store.set("fp-name", e.target.value.trim()));
  on("createBtn", "click", createTable);
  on("joinBtn", "click", () => joinTable(document.getElementById("codeIn").value));
  on("codeIn", "keydown", e => { if (e.key === "Enter") joinTable(e.target.value); });
  $app.querySelectorAll("[data-join]").forEach(b => b.addEventListener("click", () => joinTable(b.dataset.join)));
  on("leaveBtn", "click", leaveTable);
  on("copyBtn", "click", invite);
  on("sitBtn", "click", () => joinTable(tableCode));
  on("dealBtn", "click", () => mutate(tableCode, st => !canDeal(st) ? "Only the host can deal." : st.status === "playing" ? "__noop" : startHand(st)));
  on("rebuyBtn", "click", () => mutate(tableCode, st => { const p = st.players.find(x => x.id === myId); if (!p || p.chips > 0 || st.status === "playing" && p.inHand) return "__noop"; p.chips = st.startChips; log(st, `${p.name} rebought for ${fmt(st.startChips)}`); return null; }));
  $app.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => { const t = b.dataset.act; sfx.chip(); mutate(tableCode, st => act(st, myId, t)); }));
  on("raiseOpen", "click", () => { raiseOpen = true; raiseVal = 0; render(); });
  on("raiseCancel", "click", () => { raiseOpen = false; render(); });
  on("raiseRange", "input", e => { raiseVal = +e.target.value; updateRaiseLabel(); });
  $app.querySelectorAll("[data-amt]").forEach(b => b.addEventListener("click", () => { raiseVal = +b.dataset.amt; const r = document.getElementById("raiseRange"); if (r) r.value = raiseVal; updateRaiseLabel(); }));
  on("raiseGo", "click", () => { const v = raiseVal; raiseOpen = false; sfx.chip(); const me = S.players.find(p => p.id === myId); mutate(tableCode, st => v >= me.bet + me.chips ? act(st, myId, "allin") : act(st, myId, "raise", v)); });
}
function updateRaiseLabel() {
  const me = S.players.find(p => p.id === myId); const maxTo = me.bet + me.chips;
  document.getElementById("raiseAmt").textContent = fmt(raiseVal);
  document.getElementById("raiseGo").textContent = raiseVal >= maxTo ? "All-in " + fmt(maxTo) : (S.currentBet ? "Raise to " : "Bet ") + fmt(raiseVal);
}

/* ---------- Clock: updates the countdown and runs the auto actions ---------- */
function tick() {
  if (!S || !tableCode) return;
  const left = timeLeft();
  const secs = Math.ceil(left / 1000);
  const C = 2 * Math.PI * 23;
  document.querySelectorAll("[data-ring]").forEach(el => {
    el.setAttribute("stroke-dashoffset", (C * (1 - left / TURN_MS)).toFixed(1));
    el.style.stroke = left < 10000 ? "var(--danger)" : left < 25000 ? "#f0a24a" : "var(--ok)";
  });
  document.querySelectorAll("[data-secs]").forEach(el => el.textContent = secs + "s");
  const cs = document.querySelector("[data-clocksecs]"); if (cs) cs.textContent = secs + "s";
  const cf = document.querySelector("[data-clockfill]"); if (cf) cf.style.width = (left / TURN_MS * 100).toFixed(1) + "%";
  const ck = document.querySelector("[data-clock]"); if (ck) ck.classList.toggle("warn", left < 10000);
  if (S.status === "playing" && S.players[S.turn]?.id === myId && left < 10000 && left > 0) {
    const k = `${S.handNo}:${S.turn}:${S.turnAt}`;
    if (warned !== k) { warned = k; sfx.warn(); }
  }
  const nh = document.querySelector("[data-nexthand]");
  if (nh && S.status === "over") nh.textContent = `Next hand in ${Math.max(0, Math.ceil(((S.overAt || 0) + NEXT_HAND_MS - now()) / 1000))}s`;
  autoActions();
}
setInterval(tick, 1000);

let autoKey = "";
function autoActions() {
  if (!S || !tableCode || busy || !online) return;
  // 1) Shot clock expired: check if free, otherwise fold. Any player's app may do this; the transaction makes it happen once.
  if (S.status === "playing" && S.turnAt && now() > S.turnAt + TURN_MS + 1200) {
    const k = `t:${S.handNo}:${S.turn}:${S.turnAt}`;
    if (autoKey === k) return;
    autoKey = k;
    const turn = S.turn, turnAt = S.turnAt;
    mutate(tableCode, st => {
      if (st.status !== "playing" || st.turn !== turn || st.turnAt !== turnAt) return "__noop";
      const p = st.players[st.turn];
      const toCall = st.currentBet - p.bet;
      const err = act(st, p.id, toCall <= 0 ? "check" : "fold");
      if (err) return "__noop";
      p.last = toCall <= 0 ? "Timed out · check" : "Timed out · fold";
      st.log[0] = `${p.name} ran out of time (${toCall <= 0 ? "check" : "fold"})`;
      return null;
    });
    return;
  }
  // 2) Host's app deals the next hand automatically a few seconds after a hand ends.
  if (S.status === "over" && S.hostId === myId && now() > (S.overAt || 0) + NEXT_HAND_MS) {
    const k = `d:${S.handNo}`;
    if (autoKey === k) return;
    autoKey = k;
    const hn = S.handNo;
    mutate(tableCode, st => {
      if (st.status !== "over" || st.handNo !== hn) return "__noop";
      if (st.players.filter(p => !p.leaving && p.chips > 0).length < 2) return "__noop";
      return startHand(st);
    });
  }
}

/* ---------- Boot ---------- */
function fatal(title, text) {
  $app.innerHTML = `<div class="brand"><h1>Friends <span>Poker</span></h1></div><div class="panel"><h2>${esc(title)}</h2><div class="empty">${esc(text)}</div><button class="btn-gold" onclick="location.reload()">Try again</button></div>`;
}
async function boot() {
  myId = store.get("fp-id");
  if (!myId) {
    const b = new Uint8Array(12); crypto.getRandomValues(b);
    myId = "p" + Array.from(b, x => "abcdefghijklmnopqrstuvwxyz0123456789"[x % 36]).join("");
    store.set("fp-id", myId);
  }
  if (!window.firebase || !firebase.database) return fatal("No internet connection", "Friends Poker needs the internet to reach your table. Connect to Wi-Fi or mobile data and try again.");
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.databaseURL) return fatal("Game server not set up", "This copy of the app has no game server configured.");
  firebase.initializeApp(cfg);
  rdb = firebase.database();
  rdb.ref(".info/serverTimeOffset").on("value", s => { skew = s.val() || 0; });
  rdb.ref(".info/connected").on("value", s => {
    const was = online; online = !!s.val();
    const bar = document.getElementById("offline"); if (bar) bar.hidden = online;
    if (was !== online && online && tableCode) toast("Back online.", true);
  });
  rdb.ref("tables").orderByChild("updatedAt").limitToLast(10).on("value", snap => {
    const a = []; snap.forEach(c => { const d = norm(c.val()); if (d) a.push(d); });
    openTables = a.reverse();
    if (!tableCode) render();
  }, () => {});
  const saved = store.get("fp-table");
  if (saved) {
    try {
      const d = norm((await tableRef(saved).once("value")).val());
      if (d && d.players.some(p => p.id === myId)) return enterTable(saved);
    } catch {}
    store.set("fp-table", null);
  }
  render();
}
boot();
})();
</script>
</body>
</html>
