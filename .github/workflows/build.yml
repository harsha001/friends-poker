name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create signing key (first build only)
        run: |
          if [ ! -f app/friendspoker.jks ]; then
            keytool -genkeypair -keystore app/friendspoker.jks -storepass friendspoker -keypass friendspoker \
              -alias friendspoker -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Friends Poker, O=Friends Poker, C=IN"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add app/friendspoker.jks
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FriendsPoker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FriendsPoker
          path: FriendsPoker.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Friends Poker 1.0.${{ github.run_number }}
          body: Download FriendsPoker.apk below and open it on your Android phone to install.
          files: FriendsPoker.apk
          make_latest: true
